name: Nginx da midia privada

# A VPS roda a config anterior a auditoria de 2026-07-27: sem
# `location /_protected_media/` (todo arquivo privado da 404, porque o
# X-Accel-Redirect do Django nao encontra destino) e com `/media/` servido
# publicamente (qualquer um com a URL baixa documento privado sem login).
# O DEPLOY_VPS.md ja documenta a config correta; isto a aplica.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "mostrar = so exibe a config | aplicar = corrige | reverter = volta o backup mais recente"
        type: choice
        options:
          - mostrar
          - aplicar
          - reverter
        default: mostrar

concurrency:
  group: nginx-producao
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar a config atual
        if: ${{ inputs.modo == 'mostrar' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -uo pipefail
            echo "=== sites-enabled ==="
            ls -l /etc/nginx/sites-enabled/
            echo "=== conteudo (host mascarado pelo Actions) ==="
            cat -n /etc/nginx/sites-enabled/gerenciador-viagens
            echo "=== backups existentes ==="
            ls -l /etc/nginx/sites-enabled/*.bak-* 2>/dev/null || echo "nenhum backup"
            echo "=== FIM ==="

      - name: Aplicar a config documentada
        if: ${{ inputs.modo == 'aplicar' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            ARQ=/etc/nginx/sites-enabled/gerenciador-viagens

            echo "=== Reescrevendo a config ==="
            set +e
            python3 /var/www/gerenciador-viagens/app/scripts/corrigir_nginx_midia.py
            CODIGO=$?
            set -e
            if [ "$CODIGO" -ne 0 ]; then
              echo "nada aplicado (codigo $CODIGO)"
              exit "$CODIGO"
            fi

            echo "=== nginx -t ==="
            BACKUP=$(ls -t ${ARQ}.bak-* 2>/dev/null | head -1)
            if ! nginx -t; then
              echo "TESTE FALHOU -- revertendo para $BACKUP"
              cp -f "$BACKUP" "$ARQ"
              nginx -t
              exit 1
            fi

            echo "=== reload ==="
            systemctl reload nginx
            systemctl is-active nginx

            echo "=== config de midia depois ==="
            grep -n -A 3 -e "location /_protected_media/" -e "location /media/" "$ARQ"

            echo "=== /media/ tem de dar 404 agora ==="
            curl -s -o /dev/null -w 'media publico: %{http_code}\n' --max-time 10 https://gerenciadorviagens.tech/media/eventos/68/solicitacoes/oficio_494-2026_solicita_apoio_operacional_-_ascom_1.pdf || true
            curl -s -o /dev/null -w 'health: %{http_code}\n' --max-time 10 https://gerenciadorviagens.tech/health/ || true
            echo "=== FIM ==="

      - name: Reverter para o backup mais recente
        if: ${{ inputs.modo == 'reverter' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            ARQ=/etc/nginx/sites-enabled/gerenciador-viagens
            BACKUP=$(ls -t ${ARQ}.bak-* 2>/dev/null | head -1)
            if [ -z "$BACKUP" ]; then echo "nenhum backup"; exit 1; fi
            echo "revertendo para $BACKUP"
            cp -f "$BACKUP" "$ARQ"
            nginx -t
            systemctl reload nginx
            echo "=== FIM ==="
