name: Debug - ler log de producao (temporario)

on:
  workflow_dispatch:

jobs:
  ler-log:
    runs-on: ubuntu-latest

    steps:
      - name: Ler django.log e status do servico via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== journalctl -u gerenciador-viagens (ultimas 200 linhas) ====="
            journalctl -u gerenciador-viagens -n 200 --no-pager || true
            echo ""
            echo "===== tail -200 django.log ====="
            tail -200 /var/www/gerenciador-viagens/logs/django.log || true
            echo ""
            echo "===== estado do drive (pasta raiz, credenciais, pendencias, job de reorganizacao) ====="
            cd /var/www/gerenciador-viagens/app
            source /var/www/gerenciador-viagens/venv/bin/activate
            DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py shell -c "
from integracoes.google_drive.models import DriveCredenciais, DriveReorganizacaoJob, DriveSyncStatus
from documentos.models import DocumentoArtefato
c = DriveCredenciais.objects.first()
print('pasta_raiz_id:', repr(c.pasta_raiz_id) if c else None)
print('pasta_raiz_nome:', repr(c.pasta_raiz_nome) if c else None)
job = DriveReorganizacaoJob.objects.order_by('-iniciado_em').first()
if job:
    print('ultimo job reorganizacao:', job.status, job.iniciado_em, job.finalizado_em, 'eventos=', job.total_eventos, job.eventos_processados, 'avulsos=', job.avulsos, 'erros=', job.erros, 'msg=', job.mensagem)
else:
    print('nenhum job de reorganizacao encontrado')
print('pendencias:', DriveSyncStatus.objects.count())
print('artefatos totais:', DocumentoArtefato.objects.count())
print('artefatos sem DriveArquivo:', DocumentoArtefato.objects.filter(drive_arquivo__isnull=True, formato__iexact='pdf').count())
"
