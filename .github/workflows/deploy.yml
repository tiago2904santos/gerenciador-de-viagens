name: Deploy para produção

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  # Reimplantar sem commit novo: depois de consertar algo na VPS, o caminho
  # automático só volta a rodar no próximo push, e forçar um commit vazio para
  # reimplantar o mesmo código é pior do que um botão.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA a implantar (vazio = HEAD da branch escolhida)"
        required: false
        default: ""

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy tested commit via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd /var/www/gerenciador-viagens/app
            BEFORE_SHA="$(git rev-parse HEAD)"
            TARGET_SHA="${{ github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}"
            source /var/www/gerenciador-viagens/venv/bin/activate
            set -a
            source .env
            set +a

            # O .env de produção deve trazer o settings; se não trouxer, o
            # manage.py cai no default de desenvolvimento e migraria o banco
            # errado. Explícito aqui, como já é em scripts/deploy_update.sh.
            export DJANGO_SETTINGS_MODULE="${DJANGO_SETTINGS_MODULE:-config.settings.prod}"

            # Pré-checagens: qualquer coisa que falte precisa abortar ANTES do
            # checkout, senão produção fica com código novo e serviço antigo.
            : "${DB_NAME:?DB_NAME ausente no .env da VPS}"
            : "${DB_USER:?DB_USER ausente no .env da VPS}"
            : "${DB_PASSWORD:?DB_PASSWORD ausente no .env da VPS}"
            : "${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY ausente no .env da VPS}"
            # config/settings/prod.py levanta RuntimeError sem esta variável, e o
            # erro só apareceria no `migrate` — depois do checkout, com o serviço
            # ainda no código velho. Aqui aborta antes de mexer em qualquer coisa.
            : "${FIELD_ENCRYPTION_KEYS:?FIELD_ENCRYPTION_KEYS ausente no .env da VPS — gere com: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"}"

            # pg_dump lê PGHOST/PGPORT/PGUSER/PGPASSWORD, não DB_*. Sem estes
            # ele tenta o socket Unix com o usuário do SSH como role, falha com
            # `role "..." does not exist` e derruba o deploy inteiro no backup,
            # antes do checkout. Os defaults são os mesmos de config/settings/prod.py.
            export PGHOST="${DB_HOST:-127.0.0.1}"
            export PGPORT="${DB_PORT:-5432}"
            export PGUSER="$DB_USER"
            export PGPASSWORD="$DB_PASSWORD"

            git fetch origin "$TARGET_SHA"

            # Backup antes do checkout: o snapshot precisa ser do estado que
            # está no ar, não do commit que ainda vai entrar.
            # Cria o diretório aqui: o script na VPS ainda é o do commit antigo
            # e pode falhar no mktemp se /var/backups/... não existir.
            mkdir -p /var/backups/gerenciador-viagens
            # QA-03: o caminho do .enc sai no stdout de backup_production.sh e era
            # jogado fora. É ele que a instrução de recuperação precisa citar — de
            # nada adianta ter backup se quem está no incidente não sabe qual.
            # `tail -1` porque a última linha do script é o `printf` do caminho;
            # a cópia externa opcional (`rclone`, quando BACKUP_RCLONE_REMOTE está
            # definido) pode falar antes dela, e aí BACKUP_FILE viraria lixo.
            BACKUP_FILE="$(APP_ROOT=/var/www/gerenciador-viagens/app \
              bash scripts/backup_production.sh | tail -1)"
            echo "backup deste deploy: ${BACKUP_FILE}"

            # QA-03: fotografia das migrações aplicadas, para o rollback saber o
            # que ESTE deploy aplicou. Tirada com o código antigo, antes do
            # checkout, porque é o estado que ele entende.
            # `|| true` no grep: sem correspondência ele sai 1 e, com `pipefail`,
            # derrubaria o deploy num banco ainda sem migração aplicada.
            ESTADO_MIGRACOES_ANTES="$(mktemp)"
            python manage.py showmigrations --plan \
              | { grep '^\[X\]' || true; } | awk '{print $2}' > "$ESTADO_MIGRACOES_ANTES"

            reverter() {
              echo "deploy falhou — revertendo para $BEFORE_SHA"
              # QA-03: o banco volta ANTES do código. Desfazer uma migração exige
              # os arquivos de migração do commit novo em disco; depois do
              # checkout de volta eles não existem mais.
              local rollback=0
              if [ -f scripts/deploy_rollback.sh ]; then
                ESTADO_MIGRACOES_ANTES="$ESTADO_MIGRACOES_ANTES" \
                BACKUP_FILE="$BACKUP_FILE" \
                APP_ROOT=/var/www/gerenciador-viagens/app \
                  bash scripts/deploy_rollback.sh || rollback=$?
              fi
              # Sem o arquivo, estamos no commit antigo — a falha foi antes do
              # checkout, então nenhuma migração deste deploy chegou a rodar.

              git checkout --detach "$BEFORE_SHA"
              python -m pip install -r requirements/lock.txt --quiet
              systemctl restart gerenciador-viagens
              systemctl restart gerenciador-viagens-celery

              if [ "$rollback" -ne 0 ]; then
                echo "código revertido, mas o BANCO continua adiante dele — leia a instrução acima."
                return 1
              fi
              echo "revertido: código e banco no estado anterior ao deploy."
            }
            # `|| true` no trap: `reverter` devolve 1 quando o banco exigiu
            # intervenção, e sem isto o `set -e` mataria o handler antes do
            # `exit 1` — perdendo o código de saída que o Actions lê.
            trap 'reverter || true; exit 1' ERR

            git checkout --detach "$TARGET_SHA"
            python -m pip install -r requirements/lock.txt --quiet

            # NOVO-12: a régua olha a configuração REAL de produção — o .env que
            # nenhum gate do CI enxerga. Foi aqui que uma SECRET_KEY de 9
            # caracteres viveu um ciclo inteiro sem ninguém ver (core.E003 agora
            # a reprova, e core.E001 imprime a contagem de linhas sem área que o
            # DB-02 pede). DEPOIS do checkout de propósito: os checks têm de ser
            # os do código que vai entrar no ar — antes dele, o código antigo
            # (com core.E002 ainda Error e produção em `auto`) reprovaria o
            # próprio deploy que corrige o check, e nenhum deploy passaria mais.
            # Falhou aqui? O trap reverte código e banco; nada chegou ao usuário.
            # `--fail-level ERROR` de propósito: core.W001/W002 relatam sem travar.
            python manage.py check --deploy --fail-level ERROR

            # QA-03: `collectstatic` antes de `migrate`. Ele não depende do
            # schema, e é a falha mais provável e mais boba desta sequência
            # (disco cheio, permissão). Rodando antes, ela nunca acontece com o
            # banco já migrado. Depois do `migrate` só restam os dois restarts e
            # o health check.
            python manage.py collectstatic --noinput --clear
            python manage.py migrate --noinput
            systemctl restart gerenciador-viagens
            systemctl restart gerenciador-viagens-celery

            # Health check pelo mesmo caminho por onde o Nginx fala com o app:
            # gunicorn escuta em socket unix (config/settings/prod.py), o Host
            # precisa estar em ALLOWED_HOSTS (senão 400) e o X-Forwarded-Proto
            # evita o 301 do SECURE_SSL_REDIRECT — sem os três, o check passava
            # por acidente ou reprovava um deploy são.
            saude() {
              local host="${ALLOWED_HOSTS:-}"
              host="${host%%,*}"
              host="${host// /}"
              host="${host:-127.0.0.1}"
              local sock=/var/www/gerenciador-viagens/gunicorn.sock
              local args=(--fail --silent --show-error --max-time 15
                          --header "Host: ${host}"
                          --header "X-Forwarded-Proto: https")
              if [ -S "${sock}" ]; then
                curl "${args[@]}" --unix-socket "${sock}" "http://${host}/health/"
              else
                curl "${args[@]}" "http://127.0.0.1:8000/health/"
              fi
            }

            trap - ERR
            if ! saude; then
              reverter || true
              exit 1
            fi
