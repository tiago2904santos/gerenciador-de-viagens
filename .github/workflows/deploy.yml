name: Deploy para produção

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy tested commit via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd /var/www/gerenciador-viagens/app
            BEFORE_SHA="$(git rev-parse HEAD)"
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
            source /var/www/gerenciador-viagens/venv/bin/activate
            set -a
            source .env
            set +a

            # Pré-checagens: qualquer coisa que falte precisa abortar ANTES do
            # checkout, senão produção fica com código novo e serviço antigo.
            : "${DB_NAME:?DB_NAME ausente no .env da VPS}"
            : "${DB_USER:?DB_USER ausente no .env da VPS}"
            : "${DB_PASSWORD:?DB_PASSWORD ausente no .env da VPS}"
            : "${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY ausente no .env da VPS}"
            # config/settings/prod.py levanta RuntimeError sem esta variável, e o
            # erro só apareceria no `migrate` — depois do checkout, com o serviço
            # ainda no código velho. Aqui aborta antes de mexer em qualquer coisa.
            : "${FIELD_ENCRYPTION_KEYS:?FIELD_ENCRYPTION_KEYS ausente no .env da VPS — gere com: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"}"

            # pg_dump lê PGHOST/PGPORT/PGUSER/PGPASSWORD, não DB_*. Sem estes
            # ele tenta o socket Unix com o usuário do SSH como role, falha com
            # `role "..." does not exist` e derruba o deploy inteiro no backup,
            # antes do checkout. Os defaults são os mesmos de config/settings/prod.py.
            export PGHOST="${DB_HOST:-127.0.0.1}"
            export PGPORT="${DB_PORT:-5432}"
            export PGUSER="$DB_USER"
            export PGPASSWORD="$DB_PASSWORD"

            git fetch origin "$TARGET_SHA"

            # Backup antes do checkout: o snapshot precisa ser do estado que
            # está no ar, não do commit que ainda vai entrar.
            # Cria o diretório aqui: o script na VPS ainda é o do commit antigo
            # e pode falhar no mktemp se /var/backups/... não existir.
            mkdir -p /var/backups/gerenciador-viagens
            APP_ROOT=/var/www/gerenciador-viagens/app \
              bash scripts/backup_production.sh

            reverter() {
              echo "deploy falhou — revertendo para $BEFORE_SHA"
              git checkout --detach "$BEFORE_SHA"
              python -m pip install -r requirements/lock.txt --quiet
              systemctl restart gerenciador-viagens
              systemctl restart gerenciador-viagens-celery
            }
            trap 'reverter; exit 1' ERR

            git checkout --detach "$TARGET_SHA"
            python -m pip install -r requirements/lock.txt --quiet
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput --clear
            systemctl restart gerenciador-viagens
            systemctl restart gerenciador-viagens-celery

            trap - ERR
            if ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/health/; then
              reverter
              exit 1
            fi
