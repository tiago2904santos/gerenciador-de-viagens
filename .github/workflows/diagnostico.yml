name: Diagnostico manual (leitura)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Rodar comando de leitura via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/gerenciador-viagens/app
            source /var/www/gerenciador-viagens/venv/bin/activate
            export DJANGO_SETTINGS_MODULE=config.settings.prod
            export $(grep -v '^#' .env | xargs)
            cat > /tmp/diag.py << 'PYEOF'
            from integracoes.google_drive.services import get_client
            from documentos.models import DocumentoArtefato
            from oficios.models import Oficio

            client = get_client()
            svc = client._svc

            print('=== Pastas suspeitas (403 insufficientFilePermissions no addParents) ===')
            for fid in ['1HrPMhwwtZ0R_GQ40sDYR_ZiVy9rzUCBO', '14uUlmUn9WZ-RtKC5Xi0fA7TxPqSav0C1']:
                try:
                    meta = svc.files().get(
                        fileId=fid,
                        fields='id,name,trashed,driveId,parents,capabilities,owners,shared',
                        supportsAllDrives=True,
                    ).execute()
                    print(fid, '->', meta)
                except Exception as exc:
                    print(fid, '-> ERRO:', exc)

            print()
            print('=== Artefatos/atalhos do oficio 86/2026 (shortcutTargetInvalid) ===')
            oficio = Oficio.objects.filter(numero=86, ano=2026).first()
            print('oficio encontrado:', oficio)
            if oficio:
                for a in DocumentoArtefato.objects.filter(oficio=oficio):
                    reg = getattr(a, 'drive_arquivo', None)
                    file_id = reg.file_id if reg else None
                    atalho_id = reg.atalho_id if reg else None
                    print('artefato', a.pk, 'tipo=' + str(a.tipo), 'file_id=' + str(file_id), 'atalho_id=' + str(atalho_id))
                    if reg and reg.file_id:
                        try:
                            meta = svc.files().get(
                                fileId=reg.file_id,
                                fields='id,name,mimeType,trashed,shortcutDetails',
                                supportsAllDrives=True,
                            ).execute()
                            print('  canonico:', meta)
                        except Exception as exc:
                            print('  canonico ERRO:', exc)
                    if reg and reg.atalho_id:
                        try:
                            meta = svc.files().get(
                                fileId=reg.atalho_id,
                                fields='id,name,mimeType,trashed,shortcutDetails',
                                supportsAllDrives=True,
                            ).execute()
                            print('  atalho:', meta)
                        except Exception as exc:
                            print('  atalho ERRO:', exc)
            PYEOF
            python manage.py shell < /tmp/diag.py
            rm -f /tmp/diag.py
