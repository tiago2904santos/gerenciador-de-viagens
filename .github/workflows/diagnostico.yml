name: Diagnostico manual (leitura)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Rodar comando de leitura via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/gerenciador-viagens/app
            echo "=== HEAD do repo na VPS ==="
            git rev-parse HEAD
            git log --oneline -1

            echo
            echo "=== Servicos ==="
            systemctl status gerenciador-viagens --no-pager -l 2>&1 | tail -30
            echo "---- celery ----"
            systemctl status gerenciador-viagens-celery --no-pager -l 2>&1 | tail -15

            echo
            echo "=== journalctl gunicorn (80 linhas) ==="
            journalctl -u gerenciador-viagens -n 80 --no-pager 2>&1

            echo
            echo "=== gunicorn error.log (40 linhas) ==="
            tail -40 /var/www/gerenciador-viagens/logs/error.log 2>&1 || echo "sem error.log"

            echo
            echo "=== health check local ==="
            curl -sS -o /dev/null -w "health: %{http_code}\n" --max-time 10 http://127.0.0.1:8000/health/ || echo "curl falhou"

            echo
            echo "=== .env: chaves presentes (sem valores) ==="
            grep -oE '^[A-Z_][A-Z0-9_]*' .env | sort
            if grep -qE '^FIELD_ENCRYPTION_KEYS=.+' .env; then
              echo "FIELD_ENCRYPTION_KEYS: presente e nao vazia"
            else
              echo "FIELD_ENCRYPTION_KEYS: AUSENTE ou vazia (isso derruba o gunicorn)"
            fi
            if grep -qE '^DB_USER=.+' .env; then
              echo "DB_USER: presente"
            else
              echo "DB_USER: AUSENTE"
            fi

            echo
            echo "=== nginx / site publico ==="
            hostname -I 2>/dev/null || true
            curl -sS -o /dev/null -w "nginx_local: %{http_code}\n" --max-time 10 http://127.0.0.1/ || echo "nginx curl falhou"
            systemctl is-active nginx 2>&1 || true

            echo
            echo "=== disco ==="
            df -h / | tail -2
