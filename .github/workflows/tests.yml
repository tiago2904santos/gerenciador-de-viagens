name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gerenciador_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerenciador_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_USE_POSTGRES: "true"
      DB_NAME: gerenciador_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      COVERAGE_APPS: "core,usuarios,cadastros,roteiros,eventos,documentos,oficios,termos,justificativas,planos_trabalho,ordens_servico,integracoes.google_drive,prestacoes_contas"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc python3-uno

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements/lock.txt
          python -m pip install -r requirements/test-lock.txt
          python -m pip install "pip-audit>=2.9,<3.0"

      - name: Block Python lint regressions (QA-07)
        # Primeiro gate do job de propósito: não precisa de banco nem de Django,
        # roda em menos de um segundo e pega a classe de defeito que nenhum outro
        # passo pega. A primeira execução achou `_CAMPO_LABELS` indefinido em
        # `prestacoes_contas/model_views.py` (`NOVO-03`) — `NameError` em rota viva
        # que a suíte não cobria, porque não havia teste nenhum naquelas 4 views.
        #
        # Sem teto: o conjunto selecionado em `ruff.toml` está em zero e fica em
        # zero. Ampliar o conjunto (`I`, `UP`, `S`, `RUF`) é ID próprio — os
        # números medidos estão anotados lá.
        run: |
          python -m pip install -r requirements/lint.txt
          python -m ruff check .

      - name: Validate migrations and Django configuration
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.test
          python manage.py check --settings=config.settings.test

      - name: Block new frontend standards debt
        # Catraca: este número só desce. A Etapa 1 levou 465 → 449; a Etapa 7
        # levou 449 → 438 na fase 2 e 438 → 417 na fase 1.
        run: python scripts/audit_frontend_standards.py --max-warnings 296

      - name: Block new keyboard-focus suppression (HT-01)
        # Catraca: este numero so desce. 47 -> 44 no `HT-01`.
        # O piso de `:focus-visible` em base.css/auth.css neutraliza os que
        # sobraram, mas cada bloco novo e um lugar a mais onde alguem vai ter
        # de lembrar do piso — e o script nao conta o idioma correto
        # (`:focus:not(:focus-visible)`), so quem apaga o foco sem substituto.
        run: python scripts/audit_foco_visivel.py --max 36

      - name: Block backend architecture regressions (P-01, P-05)
        # Catraca: este número só desce. O P-01 fechou os quatro apps do
        # escopo: eventos 61 → 46, termos → 40, ordens_servico → 37,
        # planos_trabalho → 32. Depois: NOVO-24 zerou usuarios (3) e NOVO-25
        # centralizou o rotulo da sede, que voltara copiado em tres views
        # (eventos, termos, ordens_servico) — 32 → 30. O que resta esta fora
        # do P-01: integracoes/google_drive (10), core (9), documentos (4),
        # oficios (4), roteiros (2) e justificativas (1). Alvo final segue
        # sendo zero; ver docs/PADRAO_SELECTORS.md.
        # P-05: todo `except Exception` do Drive começa com captura estruturada.
        run: >-
          python scripts/audit_django_architecture.py
          --max-orm-em-view 29
          --max-drive-except-without-capture 0
          --max-sync-document-generations 0

      - name: Block area-scoping regressions (BE-09)
        # `BE-09` FECHADO: os 28 modelos com campo `area` recortam sozinhos, em
        # seis fatias. O teto agora é **zero** e nunca mais sobe — modelo novo com
        # campo `area` reprova aqui até declarar o par de managers.
        # Com isto o `DB-02` (`area` NOT NULL) fica desbloqueado; o `NOVO-31` vem
        # antes, porque `core.E001` ainda não olha os modelos de `cadastros`.
        # O script também reprova `all_objects` sem comentário em código de
        # caminho de request — o gate literal de docs/PLANO_BACKEND.md:88.
        run: python scripts/audit_area_scoped_managers.py --max 0

      - name: Validate production security settings
        env:
          SECRET_KEY: "ci-only-not-for-production-7c8d2c39f9f54f6c8d25aa12"
          ALLOWED_HOSTS: "localhost"
          CSRF_TRUSTED_ORIGINS: "https://localhost"
          DOCUMENTOS_DEFAULT_PDF_ENGINE: "unoserver"
          DOCUMENTOS_UNOSERVER_URL: "http://127.0.0.1:2003"
          # QA-02: prod passou a exigir REDIS_URL — o cache é compartilhado entre os
          # workers e sustenta o rate limit de login. Aqui nada conecta: o
          # `check --deploy` só lê a configuração, não abre socket.
          REDIS_URL: "redis://127.0.0.1:6379/1"
        # A chave é gerada aqui, não commitada: o `check --deploy` só exige que
        # ela exista e seja válida — não cifra nada. Um literal no arquivo seria
        # indistinguível de um segredo de verdade, para o scanner e para quem lê.
        run: |
          export FIELD_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py check --deploy --settings=config.settings.prod
          STATIC_ROOT="$RUNNER_TEMP/staticfiles" python manage.py collectstatic --noinput --clear --settings=config.settings.prod

      - name: Audit Python dependencies
        # WeasyPrint has no fixed release for PYSEC-2026-3412. Our adapter
        # explicitly disables presentational_hints and regression-tests it.
        run: >-
          python -m pip_audit -r requirements/lock.txt --disable-pip
          --ignore-vuln PYSEC-2026-3412

      - name: Enforce real document generation SLA
        run: |
          # Este é o único passo que roda sem --settings, então cai em
          # config.settings.dev — que agora exige FIELD_ENCRYPTION_KEYS. O valor
          # é irrelevante aqui (nada é cifrado), então é gerado, não commitado.
          export FIELD_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
          PYTHONPATH="$SITE_PACKAGES" /usr/bin/python3 -m unoserver.server \
            --interface 127.0.0.1 --port 2003 \
            --uno-interface 127.0.0.1 --uno-port 2002 \
            --conversion-timeout 10 --stop-after 1000 \
            > "$RUNNER_TEMP/unoserver.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/2003) 2>/dev/null; then break; fi
            sleep 0.25
          done
          # Dois orçamentos, porque são dois custos. A primeira conversão de
          # cada modelo paga o start do LibreOffice/UNO — medido em 1119 ms
          # contra 96 e 93 ms nas seguintes. Com um limite só, o gate reprovava
          # por aquecimento (3 vezes seguidas em 29/07, inclusive no main) e não
          # dizia nada sobre o regime estável. Descartar a primeira medição
          # esconderia um custo que o usuário sente na primeira geração depois
          # de ocioso; por isso ela continua vigiada, com limite próprio.
          #
          # `--max-cold-ms` foi de 1500 para 3000 em 06/08 (NOVO-28). O teto de
          # 1500 nasceu em 03/08 sobre 1119 ms medidos; em 06/08 a partida a
          # frio reprovou três vezes seguidas, com 2553,8 ms (run 654, main),
          # 1868,4 ms (run 657) e a mesma falha no run 653 — sempre SÓ a frio,
          # com o regime estável entre 96 e 101 ms, dentro do `--max-ms` de
          # 1000. Não foi código: nada mudou em `documentos/` nem no lock desde
          # 03/08, e o passo "Install LibreOffice" saiu de 28 s no último run
          # verde para 58, 60 e 77 s nos três reprovados — a mesma máquina 2 a
          # 3× mais lenta. Como o passo fica ANTES da suíte e da régua do
          # PF-07, um teto calibrado numa geração de runner que não existe mais
          # bloqueava toda prova de CI do projeto. `--max-ms` fica em 1000: é
          # ele que mede o custo que o usuário sente em uso normal.
          DOCUMENTOS_UNOSERVER_URL=http://127.0.0.1:2003 \
          DOCUMENTOS_DEFAULT_PDF_ENGINE=unoserver \
          python manage.py documentos_unoserver_check \
            --benchmark --representative-resources --iterations 3 \
            --max-ms 1000 --max-cold-ms 3000

      - name: Exercise encrypted database and media restore
        env:
          # Sem PG* de propósito: pg_dump/pg_restore leem PGHOST/PGPORT/PGUSER,
          # não DB_HOST/DB_USER, e quem chama o script em produção só tem o
          # .env com DB_*. Enquanto o drill definia as PG* aqui, ele testava um
          # caminho que produção não usa — e o deploy quebrou 26 vezes seguidas
          # com `role "..." does not exist` sem o CI ver nada (`NOVO-56`).
          # Agora o passo entra pelas DB_* do env do job, que é a mesma entrada
          # da VPS, e exercita a ponte dos dois scripts (`NOVO-57`).
          BACKUP_ENCRYPTION_KEY: "ci-restore-drill-only-key"
          RESTORE_CONFIRM: "RESTAURAR"
        run: |
          mkdir -p "$RUNNER_TEMP/media" "$RUNNER_TEMP/backups"
          printf 'restore-drill\n' > "$RUNNER_TEMP/media/probe.txt"
          APP_ROOT="$GITHUB_WORKSPACE" \
          MEDIA_ROOT="$RUNNER_TEMP/media" \
          BACKUP_ROOT="$RUNNER_TEMP/backups" \
            bash scripts/backup_production.sh
          BACKUP_FILE="$(find "$RUNNER_TEMP/backups" -name '*.tar.gz.enc' -print -quit)"
          MEDIA_ROOT="$RUNNER_TEMP/media" \
            bash scripts/restore_backup.sh "$BACKUP_FILE"
          test "$(cat "$RUNNER_TEMP/media/probe.txt")" = "restore-drill"

      - name: Exercise deploy rollback (QA-03)
        env:
          # Banco próprio: o drill migra e desmigra, e não pode interferir no
          # `gerenciador_test` que os passos vizinhos usam.
          DB_NAME: drill_rollback
        run: |
          set -o pipefail
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD"
          export DJANGO_SETTINGS_MODULE=config.settings.test
          psql -q -c "DROP DATABASE IF EXISTS drill_rollback" postgres
          psql -q -c "CREATE DATABASE drill_rollback" postgres

          estado() {
            python manage.py showmigrations --plan | { grep '^\[X\]' || true; } | awk '{print $2}'
          }

          # Estado "antes do deploy": uma migração atrás em **dois** apps. Dois de
          # propósito — é onde a ordem inversa entre apps importa, e uma ordem
          # errada só aparece com mais de um.
          python manage.py migrate --noinput > /dev/null
          python manage.py migrate justificativas 0002 --noinput > /dev/null
          python manage.py migrate termos 0006 --noinput > /dev/null
          estado > "$RUNNER_TEMP/antes.txt"

          # O "deploy" aplica as duas.
          python manage.py migrate --noinput > /dev/null
          estado > "$RUNNER_TEMP/durante.txt"
          apps_no_delta="$(comm -13 <(sort "$RUNNER_TEMP/antes.txt") <(sort "$RUNNER_TEMP/durante.txt") \
            | cut -d. -f1 | sort -u | tr '\n' ' ')"
          # Guarda contra o drill virar vácuo: se o delta parar de cruzar os dois
          # apps, ele deixou de exercitar a ordenação e isto reprova.
          test "$apps_no_delta" = "justificativas termos " \
            || { echo "::error::o drill perdeu o delta de dois apps: [$apps_no_delta]"; exit 1; }

          # O rollback tem de devolver exatamente o estado de antes.
          ESTADO_MIGRACOES_ANTES="$RUNNER_TEMP/antes.txt" bash scripts/deploy_rollback.sh
          estado > "$RUNNER_TEMP/depois.txt"
          diff "$RUNNER_TEMP/antes.txt" "$RUNNER_TEMP/depois.txt" \
            || { echo "::error::o rollback não devolveu o estado de antes"; exit 1; }

          # Caso mais comum de todos: deploy sem migração nenhuma. Tem de sair 0
          # e não encostar no banco.
          ESTADO_MIGRACOES_ANTES="$RUNNER_TEMP/depois.txt" bash scripts/deploy_rollback.sh
          estado > "$RUNNER_TEMP/depois2.txt"
          diff "$RUNNER_TEMP/depois.txt" "$RUNNER_TEMP/depois2.txt" \
            || { echo "::error::o rollback mexeu no banco sem ter o que desfazer"; exit 1; }

          psql -q -c "DROP DATABASE drill_rollback" postgres

      - name: Run complete Django test suite with coverage on PostgreSQL
        run: |
          # O omit precisa cobrir tambem os modulos de teste soltos de
          # prestacoes_contas (tests.py, tests_assinatura.py, test_*.py), que
          # ficam fora de uma pasta tests/. Sem eles na lista, 925 statements de
          # teste entram na conta como producao 100% coberta — e escrever teste
          # novo sobe o piso sozinho, que e o que o gate existe para impedir.
          # Comentario aqui em cima, e nao no meio dos `\`: dentro de uma
          # continuacao de linha o `#` comenta o resto do comando.
          python -m coverage run \
            --source="$COVERAGE_APPS" \
            --omit="*/migrations/*,*/tests/*,*/tests.py,*/tests_*.py,*/test_*.py" \
            manage.py test --settings=config.settings.test -v 1
          python -m coverage json -o coverage.json

      - name: Report and enforce coverage floors by app
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          floors = json.loads(Path(".github/coverage-floors.json").read_text())
          report = json.loads(Path("coverage.json").read_text())
          files = report["files"]
          failures = []

          print(f"{'App':28} {'Coverage':>10} {'Floor':>10}  Status")
          print(f"{'-' * 28} {'-' * 10} {'-' * 10}  {'-' * 6}")
          for app, floor in sorted(floors.items()):
              prefix = app.replace(".", "/") + "/"
              summaries = [
                  details["summary"]
                  for filename, details in files.items()
                  if filename.replace("\\", "/").startswith(prefix)
              ]
              statements = sum(item["num_statements"] for item in summaries)
              covered = sum(item["covered_lines"] for item in summaries)
              if not statements:
                  failures.append(f"{app}: no measured production statements")
                  print(f"{app:28} {'n/a':>10} {floor:9.2f}%  FAIL")
                  continue

              percent = round(100 * covered / statements, 2)
              passed = percent >= floor
              status = "PASS" if passed else "FAIL"
              print(f"{app:28} {percent:9.2f}% {floor:9.2f}%  {status}")
              if not passed:
                  failures.append(
                      f"{app}: coverage {percent:.2f}% is below floor {floor:.2f}%"
                  )

          if failures:
              for failure in failures:
                  print(f"::error title=Coverage floor regression::{failure}")
              sys.exit(1)
          PY

      - name: Enforce list performance ceilings (PF-07)
        # Último passo do job de propósito: é o mais caro (~2min30 medidos, dos
        # quais ~1min é semeadura de 20.000 registros por domínio em 9 domínios).
        # Os gates baratos já falharam antes de chegar aqui.
        #
        # `--repeticoes 1` porque tempo **não** é catraca aqui (ver o docstring do
        # script): repetição só melhoraria a mediana de um número que é
        # diagnóstico, não gate. Consulta e byte são determinísticos — medidos
        # iguais em duas execuções seguidas — e uma passada basta.
        #
        # A régua exige PostgreSQL e recusa rodar em SQLite; as DB_* e o
        # TEST_USE_POSTGRES do env do job já apontam para o serviço acima.
        #
        # `pipefail` não é decoração: o shell default da action é `bash -e`, sem
        # ele o código de saída do `tee` é que valeria e o gate passaria verde
        # justamente quando a régua reprovasse.
        run: |
          set -o pipefail
          python scripts/medir_desempenho.py --repeticoes 1 | tee "$RUNNER_TEMP/desempenho.txt"

      - name: Publish the performance report
        # Roda mesmo com a régua vermelha: o relatório é justamente o que se lê
        # para entender por que ela reprovou.
        if: always()
        run: |
          {
            echo '### Régua de desempenho (PF-07)'
            echo '```'
            cat "$RUNNER_TEMP/desempenho.txt" 2>/dev/null || echo '(a régua não chegou a produzir relatório)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
