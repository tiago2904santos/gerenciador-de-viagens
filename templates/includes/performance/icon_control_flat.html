{% load icones %}
{# Primitiva canônica para caminhos quentes renderizados por include, sem expansão Cotton. #}
{% if href %}
<a class="{{ class_name }}" href="{{ href }}" aria-label="{{ aria_label }}" data-tooltip="{{ tooltip }}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#cv-icon-{{ icon|nome_de_icone }}"></use></svg></a>
{% else %}
<button
  class="{% if class_name %}{{ class_name }}{% else %}icon-btn icon-btn--{{ variant|default:'settings' }}{% if state_class %} {{ state_class }}{% endif %}{% endif %}"
  type="button"
  aria-label="{{ aria_label }}"
  {% if overlay_kind == "menu" %}aria-haspopup="true" aria-expanded="false"{% endif %}
  {% if controls %}aria-controls="{{ controls }}"{% endif %}
  data-tooltip="{{ tooltip }}"
  {% if overlay_kind %}data-overlay-trigger data-overlay-kind="{{ overlay_kind }}" data-overlay-target="{{ overlay_target }}"{% endif %}
  {% if overlay_src %}data-overlay-src="{{ overlay_src }}"{% endif %}
  {% if delete_url %}data-delete-url="{{ delete_url }}"{% endif %}
  {% if delete_label %}data-delete-label="{{ delete_label }}"{% endif %}
  {% if delete_title %}data-delete-title="{{ delete_title }}"{% endif %}
><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#cv-icon-{{ icon|nome_de_icone }}"></use></svg></button>
{% endif %}
