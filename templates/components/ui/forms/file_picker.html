<div class="field app-form-field cv-file-field">
  {% if label %}
    <label class="app-form-label" for="{{ field_id }}">{{ label }}</label>
  {% endif %}
  <div class="cv-file-widget prestacao-file-widget{% if error_text %} is-error{% endif %}" data-file-picker>
    <div class="cv-file-picker prestacao-file-picker">
      <input type="file"
             name="{{ field_name }}"
             id="{{ field_id }}"
             class="form-control cv-field__control cv-file-input prestacao-file-input"
             accept="{{ accept|default:'application/pdf,image/png,image/jpeg,image/*' }}"
             {% if not single %}multiple{% endif %}
             aria-describedby="{{ field_id }}-status{% if help_text %} {{ field_id }}-help{% endif %}{% if error_text %} {{ field_id }}-error{% endif %}"
             {% if required %}required{% endif %}
             data-file-native="true">
      <label class="cv-file-picker__action prestacao-file-picker__action" for="{{ field_id }}">
        <span class="cv-file-picker__action-icon" aria-hidden="true">{% include "components/ui/icons/icon.html" with icon="document" only %}</span>
        <span data-file-picker-action-label>{{ action_label|default:"Selecionar arquivos" }}</span>
      </label>
      <span class="cv-file-picker__value prestacao-file-picker__value" data-file-picker-name data-default-label="{{ empty_label|default:'Nenhum arquivo selecionado' }}">{{ empty_label|default:"Nenhum arquivo selecionado" }}</span>
      <div class="cv-file-picker__inline-actions prestacao-file-picker__inline-actions" data-file-inline-actions hidden></div>
      <button class="cv-file-picker__upload prestacao-file-picker__upload" type="{{ upload_button_type|default:'submit' }}" data-file-upload-button disabled>{{ upload_label|default:"Anexar" }}</button>
    </div>
    <span class="sr-only" id="{{ field_id }}-status" role="status" aria-live="polite" data-file-picker-status>Nenhum arquivo selecionado</span>
    <div class="cv-file-selection prestacao-file-selection" data-file-selection-dropdown hidden>
      <button class="cv-file-selection__toggle prestacao-file-selection__toggle" type="button" aria-expanded="false" aria-controls="{{ field_id }}-file-menu" data-file-selection-toggle>
        <span data-file-selection-summary>Arquivos selecionados</span>
        <span class="cv-file-selection__chevron prestacao-file-selection__chevron" aria-hidden="true"></span>
      </button>
      <div class="cv-file-selection__menu prestacao-file-selection__menu" id="{{ field_id }}-file-menu" data-file-selection-menu hidden>
        <ul class="cv-file-selection__list prestacao-file-selection__list" data-file-selection-list></ul>
      </div>
    </div>
    <template data-file-selection-template>
      <li class="cv-file-selection__item prestacao-file-selection__item" data-file-selection-row>
        <div class="cv-file-widget__meta prestacao-file-widget__meta">
          <strong class="cv-file-widget__name prestacao-file-widget__name" data-file-selection-name></strong>
          <span class="cv-file-widget__subtitle prestacao-file-widget__subtitle" data-file-selection-size></span>
        </div>
        <div class="cv-file-widget__actions prestacao-file-widget__actions">
          <a class="cv-icon-btn cv-icon-btn--preview cv-file-widget__action prestacao-file-widget__action"
             href=""
             target="_blank"
             rel="noopener noreferrer"
             aria-label="Abrir arquivo selecionado"
             data-tooltip="Abrir"
             title="Abrir"
             data-file-preview-selection>
            {% include "components/ui/icons/icon.html" with icon="eye" only %}
          </a>
          <button class="cv-icon-btn cv-icon-btn--delete cv-file-widget__action prestacao-file-widget__action"
                  type="button"
                  aria-label="Remover arquivo da seleção"
                  data-tooltip="Remover"
                  title="Remover"
                  data-file-remove-selection>
            {% include "components/ui/icons/icon.html" with icon="delete" only %}
          </button>
        </div>
      </li>
    </template>
  </div>
  {% if help_text %}
    <p class="field-help app-form-help" id="{{ field_id }}-help">{{ help_text }}</p>
  {% endif %}
  {% if error_text %}
    <p class="field-error app-form-error" id="{{ field_id }}-error" role="alert">{{ error_text }}</p>
  {% endif %}
</div>
