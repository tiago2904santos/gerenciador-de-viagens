{# footer_action.html — ver docs/ui-components.md #}
{% if href %}
  <a class="cv-footer-action cv-footer-action--{{ variant|default:'add' }}{% if extra_class %} {{ extra_class }}{% endif %}"
     href="{{ href }}">
    <span class="cv-btn__icon" aria-hidden="true">{% include "components/ui/icons/icon.html" with icon=icon|default:"plus" only %}</span>
    <span>{{ label }}</span>
  </a>
{% else %}
  <button class="cv-footer-action cv-footer-action--{{ variant|default:'add' }}{% if extra_class %} {{ extra_class }}{% endif %}"
          type="{{ type|default:'button' }}">
    <span class="cv-btn__icon" aria-hidden="true">{% include "components/ui/icons/icon.html" with icon=icon|default:"plus" only %}</span>
    <span>{{ label }}</span>
  </button>
{% endif %}
