{# field_action_button.html — ver docs/ui-components.md #}
{% if href %}
  <a class="cv-field-side-action cv-field-side-action--{{ variant|default:'secondary' }}{% if extra_class %} {{ extra_class }}{% endif %}"
     href="{{ href }}"
     {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
     {% if data_rg_toggle %}aria-pressed="{{ aria_pressed|yesno:'true,false' }}" data-rg-toggle{% endif %}>
    {% if icon %}
      <span class="cv-btn__icon" aria-hidden="true">{% include "components/ui/icons/icon.html" with icon=icon only %}</span>
    {% endif %}
    <span>{{ label }}</span>
  </a>
{% else %}
  <button class="cv-field-side-action cv-field-side-action--{{ variant|default:'secondary' }}{% if extra_class %} {{ extra_class }}{% endif %}"
          type="{{ type|default:'button' }}"
          {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
          {% if data_rg_toggle %}aria-pressed="{{ aria_pressed|yesno:'true,false' }}" data-rg-toggle data-rg-label-active="Possui RG" data-rg-label-inactive="Não possui RG"{% endif %}
          {% if data_motorista_fixo_toggle %}aria-pressed="{{ aria_pressed|yesno:'true,false' }}" data-motorista-fixo-toggle data-mf-label-active="Com Motorista" data-mf-label-inactive="Sem Motorista"{% endif %}>
    {% if icon %}
      <span class="cv-btn__icon" aria-hidden="true">{% include "components/ui/icons/icon.html" with icon=icon only %}</span>
    {% endif %}
    <span>{{ label }}</span>
  </button>
{% endif %}
