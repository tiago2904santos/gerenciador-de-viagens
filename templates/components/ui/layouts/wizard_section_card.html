{# wizard_section_card.html — card de seção do wizard (UI Lab Structures) #}
<section class="cv-wizard-section-card{% if extra_class %} {{ extra_class }}{% endif %}"{% if section_id %} aria-labelledby="{{ section_id }}"{% endif %}>
  <header class="cv-wizard-section-header">
    <div class="cv-wizard-section-header__copy">
      <h3 class="cv-wizard-section-title"{% if section_id %} id="{{ section_id }}"{% endif %}>{{ title }}</h3>
      {% if description %}<p class="cv-wizard-section-subtitle">{{ description }}</p>{% endif %}
    </div>
    {% if header_actions_template %}
      <div class="cv-wizard-section-header__actions">
        {% include header_actions_template %}
      </div>
    {% endif %}
  </header>
  <div class="cv-wizard-section-body">
    {% if body_template %}
      {% include body_template %}
    {% endif %}
  </div>
</section>
