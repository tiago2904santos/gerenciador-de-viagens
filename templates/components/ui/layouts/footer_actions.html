{# footer_actions.html — ver docs/ui-components.md #}
<footer class="footer-actions">
  <div class="footer-actions__secondary">
    {% if secondary_label %}
      {% if secondary_url %}
        <a class="cv-btn cv-btn--back" href="{{ secondary_url }}">
          <span class="cv-btn__icon" aria-hidden="true">{% include "dev/ui_lab/partials/_cv_icon.html" with icon=secondary_icon|default:"arrow-left" only %}</span>
          <span>{{ secondary_label }}</span>
        </a>
      {% else %}
        <button class="cv-btn cv-btn--back" type="button">
          <span class="cv-btn__icon" aria-hidden="true">{% include "dev/ui_lab/partials/_cv_icon.html" with icon=secondary_icon|default:"arrow-left" only %}</span>
          <span>{{ secondary_label }}</span>
        </button>
      {% endif %}
    {% endif %}
  </div>
  <div class="footer-actions__primary">
    <button class="cv-btn cv-btn--{{ primary_variant|default:'primary' }}" type="{{ primary_type|default:'submit' }}">
      <span class="cv-btn__icon" aria-hidden="true">{% include "dev/ui_lab/partials/_cv_icon.html" with icon=primary_icon|default:"check" only %}</span>
      <span>{{ primary_label|default:"Salvar" }}</span>
    </button>
  </div>
</footer>
