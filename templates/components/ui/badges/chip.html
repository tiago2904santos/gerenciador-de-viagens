<span class="cv-chip{% if tone %} cv-chip--{{ tone }}{% endif %}{% if family %} cv-chip--{{ family }}{% endif %}{% if size %} cv-chip--{{ size }}{% endif %}{% if selected %} is-selected{% endif %}{% if disabled %} is-disabled{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"{% if disabled %} aria-disabled="true"{% endif %}>
  {% if icon %}<span class="cv-chip__icon" aria-hidden="true">{{ icon }}</span>{% endif %}
  <span class="cv-chip__label">{{ label }}</span>
  {% if count %}<span class="cv-chip__count">{{ count }}</span>{% endif %}
  {% if removable %}<span class="cv-chip__remove" aria-hidden="true">×</span>{% endif %}
</span>
