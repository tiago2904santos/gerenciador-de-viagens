{# Select de estado do destino. Serve tanto às linhas reais (row presente) quanto ao <template> (row ausente, row_index="__index__"). #}
<select
  class="cv-search-picker__native"
  data-entity-picker="true"
  data-entity-picker-mode="single"
  data-picker-variant="compact"
  {% if picker_open_all %}data-picker-open-all="true"{% endif %}
  data-placeholder="Buscar estado..."
  data-empty-message="Nenhum estado encontrado."
  data-picker-initial-value="{% if location_legacy_event %}{{ location_state_id|default:'' }}{% else %}{{ row.estado_id }}{% endif %}"
  data-location-state
  {% if not location_legacy_event %}name="{% if row.is_primary %}destino_estado{% else %}destino_estado_{{ row_index }}{% endif %}"{% endif %}
>
  <option value=""></option>
  {% if location_legacy_event %}
    {% for estado in estados %}
      <option value="{{ estado.pk }}" data-location-state-code="{{ estado.sigla }}"{% if location_state_code == estado.sigla %} selected{% endif %}>{{ estado.nome }} ({{ estado.sigla }})</option>
    {% endfor %}
  {% else %}
    {% for estado in form.fields.destino_estado.queryset %}
      <option value="{{ estado.pk }}"{% if row.estado_id == estado.pk|stringformat:'s' %} selected{% endif %}>{{ estado.nome }} ({{ estado.sigla }})</option>
    {% endfor %}
  {% endif %}
</select>
