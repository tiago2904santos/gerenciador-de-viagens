<section class="cv-form-subsection travel-destinations cv-ordered-field-collection{% if section_extra_class %} {{ section_extra_class }}{% endif %}"
         aria-labelledby="{{ title_id|default:'destinos-title' }}"
         id="{{ section_id|default:'sec-destinos' }}"
         data-location-rows>
  <header class="cv-form-subsection__header cv-ordered-field-collection__header">
    <div class="cv-form-subsection__copy">
      <h4 class="cv-form-subsection__title" id="{{ title_id|default:'destinos-title' }}">{{ title|default:'Destinos' }}</h4>
      <p class="cv-form-subsection__description">{{ description|default:'Adicione os locais na ordem em que serão visitados.' }}</p>
    </div>
    <div class="cv-ordered-field-collection__actions">
      <button type="button"
              class="cv-btn cv-btn--secondary cv-btn--sm"
              data-location-add
              {% if add_button_id %}id="{{ add_button_id }}"{% endif %}>
        <span>Adicionar destino</span>
      </button>
    </div>
  </header>

  <div class="cv-ordered-field-collection__list route-destinations-list"
       data-location-list
       aria-label="{{ panel_aria_label|default:'Destinos adicionados' }}"
       {% if list_id %}id="{{ list_id }}"{% endif %}>
    {% if rows_template %}
      {% include rows_template %}
    {% endif %}
  </div>

  {% if errors_template %}
    {% include errors_template %}
  {% endif %}
</section>
