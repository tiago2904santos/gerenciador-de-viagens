<div class="destination-row travel-destination-row cv-ordered-field-row{% if row_single %} destination-row--single{% endif %}{% if row_extra_class %} {{ row_extra_class }}{% endif %}"
     data-location-row
     data-location-index="{% if prefix %}{{ row_index }}{% elif has_destino_index %}{{ destino_index }}{% elif has_data_index %}{{ data_index }}{% else %}0{% endif %}">
  <span class="cv-ordered-field-row__badge" data-location-order aria-hidden="true">{{ row_ordinal|default:1 }}</span>
  <div class="cv-ordered-field-row__body">
    <div class="field-grid roteiro-sede-grid roteiro-destino-grid cv-ordered-field-row__fields">
      <div class="field app-form-field">
        {% if state_select_template %}
          {% include state_select_template %}
        {% else %}
          {{ state_field }}
        {% endif %}
      </div>
      <div class="field app-form-field">
        {% if city_select_template %}
          {% include city_select_template %}
        {% else %}
          {{ city_field }}
        {% endif %}
      </div>
    </div>
  </div>
  <button type="button"
          class="destination-remove-button cv-ordered-field-row__remove"
          title="Remover destino"
          aria-label="Remover destino"
          {% if row_single or remove_hidden %}hidden{% endif %}
          data-location-remove>×</button>
</div>
