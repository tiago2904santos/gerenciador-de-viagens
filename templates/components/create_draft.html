{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="page-shell page-shell--standard-simple">
  <section class="cv-form-section-card" aria-labelledby="create-draft-title">
    <header class="cv-form-section-header">
      <div class="cv-form-section-header__copy">
        <h1 class="cv-form-section-title" id="create-draft-title">{{ page_title }}</h1>
        <p class="cv-form-section-subtitle">{{ page_description }}</p>
      </div>
    </header>
    <div class="cv-form-section-body">
      <p>O rascunho será criado somente após a sua confirmação.</p>
      <form method="post">
        {% csrf_token %}
        <button class="cv-btn cv-btn--primary" type="submit">{{ confirm_label }}</button>
        <a class="cv-btn cv-btn--secondary" href="{{ back_url }}">Cancelar</a>
      </form>
    </div>
  </section>
</div>
{% endblock %}
