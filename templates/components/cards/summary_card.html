<article class="cv-metric cv-metric--tile cv-summary-tile summary-card">
  <span class="cv-metric__label cv-summary-tile__label summary-label">{{ label }}</span>
  <strong class="cv-metric__value cv-summary-tile__value">{{ value }}</strong>
  {% if description %}<p class="cv-metric__description cv-summary-tile__description">{{ description }}</p>{% endif %}
</article>
