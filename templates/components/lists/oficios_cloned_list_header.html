<form class="page-header-stack" method="get" action="{{ request.path }}" data-cv-live-submit-form>
  <div class="page-header-band">
    <div class="page-header-band__content">
      <div class="page-header-band__text">
        <span class="page-header-band__eyebrow">{{ eyebrow }}</span>
        <h1 class="page-header-band__title">{{ page_title }}</h1>
      </div>
    </div>
  </div>

  <div class="page-header-rail page-header-rail--filters oficios-rail">
    <div class="header-filter-bar header-filter-bar--advanced oficios-filter-bar">
      <div class="header-filter-bar__search oficios-filter-bar__search-row oficios-filter-bar__single-row">
        <div class="oficios-filter-bar__search-wrap">
          <span class="oficios-filter-bar__search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <input
            class="header-filter-input oficios-filter-bar__search-input"
            type="search"
            name="q"
            placeholder="{{ search_placeholder }}"
            aria-label="{{ search_aria_label }}"
            data-cv-filter="search"
            {% if q %}value="{{ q }}"{% endif %}
          >
        </div>

        <div class="cv-custom-select oficios-filter-cs" data-cv-select>
          <select name="temporal" aria-label="Período da viagem" data-cv-filter="select">
            {% for opt in temporal_options %}
              <option value="{{ opt.value }}"{% if opt.value == temporal %} selected{% endif %}>{{ opt.label }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="cv-custom-select oficios-filter-cs" data-cv-select>
          <select name="sort" aria-label="Ordenar por" data-cv-filter="select">
            {% for opt in sort_options %}
              <option value="{{ opt.value }}"{% if opt.value == sort or not sort and forloop.first %} selected{% endif %}>{{ opt.label }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="cv-date-picker oficios-filter-range" data-cv-date-picker data-mode="range"{% if viagem_de %} data-initial-date="{{ viagem_de }}"{% endif %}>
          <button type="button"
                  class="oficios-filter-range__btn"
                  data-cv-date-picker-trigger
                  aria-expanded="false"
                  aria-label="Filtrar por período da viagem">
            <span class="cv-btn__icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <span class="oficios-filter-range__label" data-cv-date-picker-display-text>Período da viagem</span>
          </button>
          <input type="hidden" name="viagem_de" data-cv-date-picker-start-value data-cv-filter="date" {% if viagem_de %}value="{{ viagem_de }}"{% endif %}>
          <input type="hidden" name="viagem_ate" data-cv-date-picker-end-value data-cv-filter="date" {% if viagem_ate %}value="{{ viagem_ate }}"{% endif %}>
          <input type="hidden" data-cv-date-picker-display>
          <div class="cv-date-picker__panel oficios-date-panel" hidden data-cv-date-picker-panel>
            <div class="cv-date-picker__panel-header">
              <button class="cv-date-picker__nav" type="button" data-cv-date-picker-prev aria-label="Mês anterior">Anterior</button>
              <div class="cv-date-picker__month" data-cv-date-picker-month></div>
              <button class="cv-date-picker__nav" type="button" data-cv-date-picker-next aria-label="Próximo mês">Próximo</button>
            </div>
            <div class="cv-date-picker__weekdays" data-cv-date-picker-weekdays></div>
            <div class="cv-date-picker__days" data-cv-date-picker-days></div>
            <div class="cv-date-picker__footer">
              <button type="button" class="cv-date-picker__footer-action" data-cv-date-picker-today>Hoje</button>
              <button type="button" class="cv-date-picker__footer-action" data-cv-date-picker-clear>Limpar</button>
            </div>
          </div>
        </div>

        {% include "components/ui/buttons/button.html" with href=search_clear_url label="Limpar filtros" variant="secondary" icon="x" extra_class="cv-btn--control oficios-filter-clear" only %}
      </div>
    </div>
  </div>
</form>

<script>
(function () {
  var currentScript = document.currentScript;
  var form = currentScript ? currentScript.previousElementSibling : null;
  var range = form ? form.querySelector('.oficios-filter-range') : null;
  if (!range) return;
  var label = range.querySelector('[data-cv-date-picker-display-text]');
  var startInput = range.querySelector('[data-cv-date-picker-start-value]');
  var endInput = range.querySelector('[data-cv-date-picker-end-value]');
  if (!label || !startInput) return;

  var placeholder = label.textContent;

  function fmt(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return '';
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function sync() {
    var s = (startInput.value || '').trim();
    var e = endInput && (endInput.value || '').trim();
    if (s && e) {
      label.textContent = fmt(s) + '  ->  ' + fmt(e);
      range.classList.add('oficios-filter-range--active');
    } else if (s) {
      label.textContent = fmt(s) + '  ->  ...';
      range.classList.add('oficios-filter-range--active');
    } else {
      label.textContent = placeholder;
      range.classList.remove('oficios-filter-range--active');
    }
  }

  startInput.addEventListener('change', sync);
  if (endInput) endInput.addEventListener('change', sync);
  sync();
})();
</script>
