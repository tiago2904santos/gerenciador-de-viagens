<div class="field {{ size_class }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="cv-field-row">
    {{ field.as_widget }}
    {% if action_url %}
    <a class="cv-field-side-action cv-field-side-action--secondary" href="{{ action_url }}">{{ action_label }}</a>
    {% endif %}
  </div>
  {% if field.errors %}<p class="field-error">{{ field.errors|striptags }}</p>{% endif %}
</div>
