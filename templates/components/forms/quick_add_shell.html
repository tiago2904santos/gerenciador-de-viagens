{# quick_add_shell.html — shell compacto reutilizável para quick add #}
<section class="quick-create-panel quick-create-panel--page is-open{% if extra_class %} {{ extra_class }}{% endif %}"{% if section_id %} aria-labelledby="{{ section_id }}"{% endif %}>
  <div class="quick-create-panel__header">
    <div class="quick-create-panel__copy">
      {% if eyebrow %}<span class="quick-create-panel__eyebrow">{{ eyebrow }}</span>{% endif %}
      <h2 class="quick-create-panel__title"{% if section_id %} id="{{ section_id }}"{% endif %}>{{ title }}</h2>
      {% if description %}<p class="quick-create-panel__subtitle">{{ description }}</p>{% endif %}
    </div>
  </div>
  <div class="quick-create-panel__body quick-create-panel__body--page">
    {% if body_template %}
      {% include body_template with form=form only %}
    {% endif %}
  </div>
</section>
