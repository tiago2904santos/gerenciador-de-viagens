{# Markup idêntico a termos/partials/_oficio_body.html; multi via select[name=oficios]. #}
<div class="search-picker search-picker--single search-picker--detailed search-picker--people search-picker--roster related-route-picker termo-oficio-picker">
  <div class="search-picker__field">
    <div class="search-picker__control">
      <span class="search-picker__icon" aria-hidden="true"></span>
      <input
        type="search"
        id="id_oficio_busca"
        class="search-picker__input"
        placeholder="Buscar por número, protocolo, destino, sede, viatura ou servidor"
        autocomplete="off"
        role="searchbox"
        aria-label="Buscar ofício vinculado"
      >
    </div>
  </div>
  {{ form.oficios }}
  {% if form.oficios.errors %}
    <c-ui.feedback.field_error :errors="form.oficios.errors" :field_id="form.oficios.auto_id" only />
  {% endif %}
  <section class="search-picker__selected-panel termo-oficio-summary-panel" aria-label="Ofícios encontrados">
    <div id="termo-oficio-lista" class="search-picker__selected-list roteiro-editor__route-list related-route-list related-route-list"></div>
    <p class="search-picker__selected-empty" id="termo-oficio-lista-empty" hidden>Nenhum ofício encontrado para a busca.</p>
  </section>
</div>
