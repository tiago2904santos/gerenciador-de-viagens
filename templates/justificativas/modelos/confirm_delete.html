{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="page-shell page-shell--standard-simple">
    <c-ui.headers.page_header eyebrow="OFÍCIOS" :title="page_title" :description="page_description" icon_label="JT" module_label="Justificativas" only />
    <form class="main-form-panel" method="post">
      {% csrf_token %}
      <c-feedback.confirm_delete_block :object_label="object.nome" message="Esta ação remove o modelo da lista de sugestões; vínculos em ofícios ficam sem modelo associado." preview_label="Prévia do texto" :preview_text="object.texto" primary_label="Excluir modelo" :back_url="back_url" only />
    </form>
  </div>
{% endblock %}
