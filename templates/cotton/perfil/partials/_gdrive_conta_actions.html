{% cotton:vars drive_autorizado drive_creds %}
{% if drive_autorizado and drive_creds %}
  <div class="gdrive-actions gdrive-actions--head">
    <a href="{% url 'google_drive:oauth_iniciar' %}" class="cv-btn cv-btn--secondary cv-btn--sm">Trocar conta</a>
    <form method="post" action="{% url 'google_drive:oauth_revogar' %}"
          data-confirm-submit data-confirm-message="Desconectar a conta Google vai remover os tokens salvos. Continuar?">
      {% csrf_token %}
      <button type="submit" class="cv-btn cv-btn--sm gdrive-btn-unlink">Desconectar</button>
    </form>
  </div>
{% else %}
  <div class="gdrive-actions gdrive-actions--head">
    <a href="{% url 'google_drive:oauth_iniciar' %}" class="cv-btn cv-btn--primary cv-btn--sm">Conectar conta Google</a>
  </div>
{% endif %}
