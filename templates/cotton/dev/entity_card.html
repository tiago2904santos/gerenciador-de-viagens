{% cotton:vars eyebrow slot state_label temporal title %}
<article class="main-preview-entity-card">
  <header class="main-preview-entity-card__header">
    <div class="main-preview-entity-card__heading">
      <span class="main-preview-entity-card__accent" aria-hidden="true"></span>
      <div>
        <p class="main-preview-entity-card__eyebrow">{{ eyebrow }}</p>
        <h2 class="main-preview-entity-card__title">{{ title }}</h2>
      </div>
    </div>
    <div class="main-preview-entity-card__chips">
      <span class="main-preview-entity-card__chip main-preview-entity-card__chip--status">{{ state_label }}</span>
      <span class="main-preview-entity-card__chip main-preview-entity-card__chip--temporal">{{ temporal }}</span>
    </div>
  </header>

  <div class="main-preview-entity-card__body">{{ slot }}</div>

  <footer class="main-preview-entity-card__footer">
    <div class="main-preview-entity-card__footer-group">
      <c-ui.buttons.button class_name="main-preview-entity-card__icon-button" type="button" aria_label="Editar ofício">✎</c-ui.buttons.button>
      <c-ui.buttons.button class_name="main-preview-entity-card__icon-button main-preview-entity-card__icon-button--accent" type="button" aria_label="Abrir documentos">□</c-ui.buttons.button>
    </div>
    <c-ui.buttons.button class_name="main-preview-entity-card__icon-button" type="button" aria_label="Mais ações">⋮</c-ui.buttons.button>
  </footer>
</article>
