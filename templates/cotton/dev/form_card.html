{% cotton:vars aria_label description slot title title_id %}
<section class="main-preview-form-card" aria-labelledby="{{ title_id }}"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>
  <header class="main-preview-form-card__header">
    <div class="main-preview-form-card__header-copy">
      <h2 class="main-preview-form-card__title" id="{{ title_id }}">{{ title }}</h2>
      {% if description %}<p class="main-preview-form-card__description">{{ description }}</p>{% endif %}
    </div>
  </header>
  <div class="main-preview-form-card__body">
    {{ slot }}
  </div>
</section>
