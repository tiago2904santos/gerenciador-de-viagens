{% cotton:vars action eyebrow title toggle variant="standard" %}
<header class="main-preview-header main-preview-header--{{ variant }}">
  <div class="main-preview-header__copy">
    <p class="main-preview-header__eyebrow">{{ eyebrow }}</p>
    <div class="main-preview-header__headline">
      <h1 class="main-preview-header__title">{{ title }}</h1>
    </div>
  </div>

  {% if variant == "toggle" and toggle %}
    <div class="main-preview-header__toggle">{{ toggle }}</div>
  {% elif variant == "button" and action %}
    <div class="main-preview-header__action">{{ action }}</div>
  {% endif %}
</header>
