{% cotton:vars action aria_label data_autosave_link extra_class href size tooltip type %}
{# icon_button.html — ver docs/ui-components.md #}
{% if href %}
  <a class="icon-btn icon-btn--{{ action }}{% if size %} icon-btn--{{ size }}{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"
     href="{{ href }}"
     aria-label="{{ aria_label }}"
     data-tooltip="{{ tooltip|default:aria_label }}"
     {% if action == "preview" %}target="_blank" rel="noopener noreferrer"{% elif action == "pdf" or action == "docx" %}download{% endif %}
     {% if data_autosave_link %}data-autosave-link="1"{% endif %}
  >{% if action == "preview" %}<c-ui.icons.icon icon="eye" only />{% else %}<c-ui.icons.icon :icon="action" only />{% endif %}</a>
{% else %}
  <button class="icon-btn icon-btn--{{ action }}{% if size %} icon-btn--{{ size }}{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"
          type="{{ type|default:'button' }}"
          aria-label="{{ aria_label }}"
          data-tooltip="{{ tooltip|default:aria_label }}"
          {% if data_autosave_link %}data-autosave-link="1"{% endif %}
  >{% if action == "preview" %}<c-ui.icons.icon icon="eye" only />{% else %}<c-ui.icons.icon :icon="action" only />{% endif %}</button>
{% endif %}
