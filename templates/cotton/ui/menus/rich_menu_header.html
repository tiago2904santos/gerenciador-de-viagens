{% cotton:vars icon subtitle title %}
<div class="action-menu__heading">
  <span class="action-menu__heading-icon" aria-hidden="true">
    {% with cotton_attr_icon=icon|default:"folder" %}<c-ui.icons.icon :icon="cotton_attr_icon" only />{% endwith %}
  </span>
  <span class="action-menu__heading-copy">
    <strong>{{ title }}</strong>
    {% if subtitle %}<small>{{ subtitle }}</small>{% endif %}
  </span>
</div>
