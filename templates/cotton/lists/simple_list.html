{% cotton:vars empty_action_label empty_action_url empty_message empty_variant hide_realtime_count rows %}
{% if rows %}
  {% if not hide_realtime_count %}
    <span class="pagination-shell__info" data-collection-count data-collection-count-template="{% verbatim %}{{visible}} de {{total}}{% endverbatim %} visíveis" hidden aria-live="polite"></span>
  {% endif %}
  <div class="record-list simple-list" role="list" data-collection-container>
    {% for row in rows %}
      <c-lists.simple_list_row :row="row" :row_index="forloop.counter" />
    {% endfor %}
  </div>
  <div data-collection-empty hidden>
    <c-lists.list_empty :message="empty_message" :action_label="empty_action_label" :action_url="empty_action_url" :variant="empty_variant" only />
  </div>
{% else %}
  <c-lists.list_empty :message="empty_message" :action_label="empty_action_label" :action_url="empty_action_url" :variant="empty_variant" only />
{% endif %}
