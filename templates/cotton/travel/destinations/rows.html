{% cotton:vars form hide_order_badge picker_open_all prefix show_row_add %}
{# Linhas de destino de um formulário. Parâmetros: prefix, picker_open_all, show_row_add, hide_order_badge (opcionais). #}
{% for row in form.destination_rows %}

{% endfor %}
