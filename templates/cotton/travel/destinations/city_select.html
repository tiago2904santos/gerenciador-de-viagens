{% cotton:vars location_city_value location_legacy_event picker_open_all row row_index %}
{# Select de cidade do destino. Serve tanto às linhas reais (row presente) quanto ao <template> (row ausente → sem opções, disabled). #}
<select
  class="search-picker__native"
  data-entity-picker="true"
  data-entity-picker-mode="single"
  data-picker-variant="compact"
  {% if picker_open_all %}data-picker-open-all="true"{% endif %}
  data-placeholder="Buscar cidade..."
  data-empty-message="Nenhuma cidade encontrada."
  data-picker-initial-value="{% if location_legacy_event %}{{ location_city_value|default:'' }}{% else %}{{ row.cidade_id }}{% endif %}"
  data-location-city
  {% if not location_legacy_event %}name="{% if row.is_primary %}destino_cidade{% else %}destino_cidade_{{ row_index }}{% endif %}"{% endif %}
  {% if location_legacy_event or not row.estado_id %}disabled{% endif %}
>
  <option value=""></option>
  {% if not location_legacy_event %}
    {% for cidade in row.cidades %}
      <option value="{{ cidade.pk }}"{% if row.cidade_id == cidade.pk|stringformat:'s' %} selected{% endif %}>{{ cidade.nome }}</option>
    {% endfor %}
  {% endif %}
</select>
