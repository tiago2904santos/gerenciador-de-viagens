{% extends "oficios/wizard_base.html" %}
{% load static %}

{% block wizard_content %}
  {% if mostrar_pendencias_documento and pendencias %}
    <c-ui.feedback.pendencias_card :items="pendencias" title="Pendências para concluir esta etapa" tone="warning" only />
  {% endif %}

  <input type="hidden" name="transporte_embed" value="1">
  <div class="form-section-stack form-section-stack--comfortable" data-travel-document-wizard-step1 data-oficio-driver-source>
    <c-form.card title="Informações da viagem" description="Identificação, finalidade, equipe e transporte" title_id="travel-document-wizard-dados-principais" :heading_level="2" body_extra_class="travel-document-body" body_template="oficios/partials/_dados_viajantes_body.html" footer_template="oficios/partials/_dados_viajantes_footer.html" footer_data_hook="oficio-viatura-footer" />
  </div>
{% endblock %}

{% block extra_js %}
  {{ block.super }}
  <script src="{% static 'js/pages/oficios-dados-viajantes.js' %}" defer></script>
  <script src="{% static 'js/pages/oficios-transporte.js' %}" defer></script>
  <script src="{% static 'js/pages/oficios-wizard-driver-state.js' %}" defer></script>
  <script src="{% static 'js/pages/oficios-viatura-sugestoes.js' %}" defer></script>
{% endblock %}
