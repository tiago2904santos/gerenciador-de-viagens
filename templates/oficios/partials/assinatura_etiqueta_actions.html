{% if painel.disponivel and painel.artefato and painel.etiqueta_urls %}
  <div class="oficio-assinatura-etiqueta-links app-form-actions oficio-assinatura-etiqueta-links--wrap">
    <a class="btn btn-secondary app-btn app-btn--secondary" href="{{ painel.etiqueta_urls.gerar_link }}">Gerar link de assinatura</a>
    <a class="btn btn-secondary app-btn app-btn--secondary" href="{{ painel.etiqueta_urls.pdf_original }}" target="_blank" rel="noopener noreferrer">PDF original</a>
    {% if painel.etiqueta_urls.verificar %}
      <a class="btn btn-secondary app-btn app-btn--secondary" href="{{ painel.etiqueta_urls.verificar }}">Ver assinatura</a>
      <a class="btn btn-secondary app-btn app-btn--secondary" href="{{ painel.etiqueta_urls.pdf_assinado }}" target="_blank" rel="noopener noreferrer">PDF assinado</a>
    {% endif %}
    {% if painel.etiqueta_status == "invalido" %}
      <span class="oficio-documentos-sig-badge oficio-documentos-sig-badge--unsigned" role="status">Assinatura inválida/desatualizada</span>
    {% endif %}
  </div>
{% endif %}
