{% if painel.disponivel and painel.artefato and painel.etiqueta_urls %}
  <div class="oficio-assinatura-etiqueta-links app-form-actions oficio-assinatura-etiqueta-links--wrap">
    <a class="button button--secondary" href="{{ painel.etiqueta_urls.gerar_link }}">Gerar link de assinatura</a>
    <a class="button button--secondary" href="{{ painel.etiqueta_urls.pdf_original }}" target="_blank" rel="noopener noreferrer">PDF original</a>
    {% if painel.etiqueta_urls.verificar %}
      <a class="button button--secondary" href="{{ painel.etiqueta_urls.verificar }}">Ver assinatura</a>
      <a class="button button--secondary" href="{{ painel.etiqueta_urls.pdf_assinado }}" target="_blank" rel="noopener noreferrer">PDF assinado</a>
    {% endif %}
    {% if painel.etiqueta_status == "invalido" %}
      <c-ui.badges.chip label="Assinatura inválida/desatualizada" tone="danger" only />
    {% endif %}
  </div>
{% endif %}
