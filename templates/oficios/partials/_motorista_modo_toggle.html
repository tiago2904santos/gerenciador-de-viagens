{# Segmented toggle SERVIDOR ↔ MANUAL — incluso no label-row de cada painel #}
<div class="segment-toggle" role="group" aria-label="Modo de preenchimento do motorista" data-oficio-motorista-modo-toggle>
  <c-ui.buttons.button
    type="button"
    class_name="segment-toggle__btn"
    data-oficio-motorista-modo-btn
    data-value="SERVIDOR"
    aria-pressed="{% if modo_atual != 'MANUAL' %}true{% else %}false{% endif %}" only>No sistema</c-ui.buttons.button>
  <c-ui.buttons.button
    type="button"
    class_name="segment-toggle__btn"
    data-oficio-motorista-modo-btn
    data-value="MANUAL"
    aria-pressed="{% if modo_atual == 'MANUAL' %}true{% else %}false{% endif %}" only>Manual</c-ui.buttons.button>
</div>
