<section class="cv-wizard-section-card{% if not show_motorista_card %} is-wizard-trailing-card{% endif %}" aria-labelledby="oficio-wizard-viatura-title" data-oficio-viatura-card>
  <header class="cv-wizard-section-header">
    <div class="cv-wizard-section-header__copy">
      <h3 class="cv-wizard-section-title" id="oficio-wizard-viatura-title">Viatura</h3>
    </div>
    <div class="cv-wizard-section-header__actions">
      {% include "components/buttons/action_button.html" with href=viatura_create_url label="Cadastrar nova viatura" variant="secondary" only %}
    </div>
  </header>
  <div class="cv-wizard-section-body">
    <div class="viatura-sugestoes" data-viatura-sugestoes hidden>
      <p class="viatura-sugestoes__label">Sugestões</p>
      <div class="viatura-sugestoes__chips" data-viatura-sugestoes-chips></div>
    </div>
    {% include "components/forms/form_field.html" with field=form.viatura only %}
  </div>
</section>
