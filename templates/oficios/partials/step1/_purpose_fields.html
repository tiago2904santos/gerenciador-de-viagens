<c-ui.forms.field :field="form.modelo_motivo" label="Modelo de motivo" :action_url="modelos_motivo_url" action_label="Gerenciar modelos" only />
{% if not tem_modelos_motivo %}
  <div class="field">
    <p class="field-help">Nenhum modelo cadastrado. <a href="{{ modelos_motivo_url }}">Abrir gerenciamento de modelos</a></p>
  </div>
{% endif %}
<div class="field app-form-field cv-field oficio-motivo-field oficio-reveal-panel is-open" data-oficio-custeio-observacao-panel>
  <label class="sr-only" for="{{ form.motivo.id_for_label }}">Descrição</label>
  {{ form.motivo }}
  {% if form.motivo.errors %}
    <c-ui.feedback.field_error :errors="form.motivo.errors" :field_id="form.motivo.auto_id" only />
  {% endif %}
</div>
