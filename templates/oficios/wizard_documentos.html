{% extends "oficios/wizard_base.html" %}
{% load static %}

{% block extra_css %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'css/pages/roteiros.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/oficios-documentos-inline.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/prestacoes_contas.css' %}">
{% endblock %}

{% block wizard_content %}
  {% if mostrar_pendencias %}
    <c-ui.feedback.pendencias_card :items="pendencias_documentos" lead="Corrija os itens abaixo antes de finalizar o ofício ou gerar DOCX/PDF." only />
  {% endif %}

  <div data-travel-document-wizard-documentos>
    <c-form.card title="Documentos e conferência" description="Arquivos gerados, resumo e roteiro para revisão final" title_id="oficio-documentos-unified-title" :heading_level="2" extra_class="oficio-documentos-unified-card oficio-documentos-card" body_extra_class="oficio-documentos-body" body_template="oficios/partials/_documentos_wizard_body.html" footer_template="oficios/partials/_documentos_wizard_footer.html" />
  </div>
{% endblock %}

{% block wizard_modals %}
  <c-ui.modals.attach_signed_modal />
{% endblock %}

{% block extra_js %}
  {{ block.super }}
  <script src="{% static 'js/pages/oficios-documentos-inline.js' %}" defer></script>
{% endblock %}
