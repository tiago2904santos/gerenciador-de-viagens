<div class="field-grid field-grid--cols-2">
  {% with help_id=form.password1.id_for_label|add:"_helptext" error_id=form.password1.id_for_label|add:"_error" %}
  <c-v2.field :label="form.password1.label" :label_for="form.password1.id_for_label" :help="form.password1.help_text" :help_id="help_id" :error="form.password1.errors.0" :error_id="error_id">
    <c-slot name="control"><c-v2.input :field="form.password1" /></c-slot>
  </c-v2.field>
  {% endwith %}
  {% with help_id=form.password2.id_for_label|add:"_helptext" error_id=form.password2.id_for_label|add:"_error" %}
  <c-v2.field :label="form.password2.label" :label_for="form.password2.id_for_label" :help="form.password2.help_text" :help_id="help_id" :error="form.password2.errors.0" :error_id="error_id">
    <c-slot name="control"><c-v2.input :field="form.password2" /></c-slot>
  </c-v2.field>
  {% endwith %}
</div>
