<c-v2.modal :own_form="True" modal_id="vincular-usuario-modal" hook="data-vincular-usuario-modal" title="Vincular usuário" title_id="vincular-usuario-title" extra_class="vincular-usuario-modal">
  <c-slot name="body">
    <form method="post" class="vincular-usuario-modal__form" data-vincular-usuario-form>
      {% csrf_token %}
      {{ vincular_form.usuario }}
      <p class="modal__message" id="vincular-usuario-description">
        Escolha a área e o perfil de <strong data-vincular-usuario-label>este usuário</strong>.
      </p>
      <c-v2.form_errors :form="vincular_form" />
      <div class="form-stack">
        <c-v2.form_field :field="vincular_form.area" size_class="field-size-1" />
        <c-v2.field :label="vincular_form.papel.label" :label_for="vincular_form.papel.id_for_label" :error="vincular_form.papel.errors.0" extra_class="field-size-1">
          <c-slot name="control"><c-v2.select :field="vincular_form.papel" /></c-slot>
        </c-v2.field>
      </div>
      <c-v2.card_footer>
        <c-slot name="secondary"><c-v2.button label="Cancelar" icon="arrow-left" hook="data-overlay-close" /></c-slot>
        <c-slot name="primary"><c-v2.button label="Salvar vínculo" variant="primary" type="submit" icon="arrow-right" :icon_after="True" /></c-slot>
      </c-v2.card_footer>
    </form>
  </c-slot>
</c-v2.modal>
