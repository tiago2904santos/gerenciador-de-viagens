{% if rows %}
  <div class="record-list" role="list" data-collection-container>
    {% for row in rows %}<c-v2.catalog_row :row="row" :csrf_token="csrf_token" />{% endfor %}
  </div>
{% else %}
  <c-v2.panel empty_title="Nenhum usuário vinculado" empty_message="Nenhum usuário vinculado a esta área." />
{% endif %}
<c-v2.pagination :page_obj="page_obj" :pages="pagination_pages" />
