{% comment %}Um diálogo atende criação e edição do vínculo; o JS troca a copy e os valores.{% endcomment %}
<c-v2.modal :own_form="True" modal_id="vincular-usuario-modal" hook="data-vincular-usuario-modal" vinculo_mode="create" title="Vincular usuário" title_id="vincular-na-area-title" extra_class="vincular-usuario-modal">
  <c-slot name="body">
    <form method="post" action="{{ vinculo_action_url }}" class="vincular-usuario-modal__form" data-vincular-usuario-form novalidate>
      {% csrf_token %}
      {{ vinculo_form.area }}
      <p class="modal__message" id="vincular-na-area-description">
        <span data-vinculo-intro="create">Escolha a conta e o perfil de acesso à área <strong>{{ area.sigla }}</strong>.</span>
        <span data-vinculo-intro="edit" hidden>Trocando o perfil de <strong data-vinculo-edit-label>este usuário</strong> na área {{ area.sigla }}.</span>
      </p>
      <c-v2.form_errors :form="vinculo_form" />
      <div class="form-stack">
        <c-v2.form_field :field="vinculo_form.usuario" size_class="field-size-1" />
        <c-v2.field :label="vinculo_form.papel.label" :label_for="vinculo_form.papel.id_for_label" :error="vinculo_form.papel.errors.0" extra_class="field-size-1">
          <c-slot name="control"><c-v2.select :field="vinculo_form.papel" /></c-slot>
        </c-v2.field>
      </div>
      <c-v2.card_footer>
        <c-slot name="secondary"><c-v2.button label="Cancelar" icon="arrow-left" hook="data-overlay-close" /></c-slot>
        <c-slot name="primary"><c-v2.button label="Salvar vínculo" variant="primary" type="submit" icon="arrow-right" :icon_after="True" /></c-slot>
      </c-v2.card_footer>
    </form>
  </c-slot>
</c-v2.modal>
