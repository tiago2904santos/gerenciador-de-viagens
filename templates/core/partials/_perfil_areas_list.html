{% if vinculos_area %}
  <div class="record-list simple-list" role="list">
    {% for vinculo in vinculos_area %}
      <div class="record-row" role="listitem">
        <span class="record-row__identity" aria-hidden="true"><span>{{ vinculo.area.sigla|slice:":2" }}</span></span>
        <div class="record-row__content">
          <div class="record-row__heading">
            <span class="record-row__title">{{ vinculo.area.sigla }} · {{ vinculo.area.nome }}</span>
          </div>
          <div class="record-row__facts">
            <span class="record-row__fact">
              <span class="record-row__fact-label">Perfil</span>
              <span class="record-row__fact-value">{{ vinculo.get_papel_display }}</span>
            </span>
          </div>
        </div>
        {% if vinculo.area_padrao %}
          <div class="record-row__actions">
            <c-v2.chip tone="info" label="Padrão" size="compact" only />
          </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% else %}
  <c-v2.panel empty_title="Nenhuma área vinculada" empty_message="Solicite a um administrador o acesso a uma área de trabalho." />
{% endif %}
