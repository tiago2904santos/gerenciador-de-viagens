{% for vinculo in vinculos_area %}
  {% with papel=vinculo.get_papel_display %}
    {% if vinculo.area_padrao %}
      <c-v2.record :eyebrow="vinculo.area.sigla" :title="vinculo.area.nome" :meta="papel" status="Padrão" status_tone="info" heading_level="3" />
    {% else %}
      <c-v2.record :eyebrow="vinculo.area.sigla" :title="vinculo.area.nome" :meta="papel" heading_level="3" />
    {% endif %}
  {% endwith %}
{% endfor %}
