<article class="ui-lab-overview-card">
  <div class="ui-lab-overview-card__mark" aria-hidden="true">{{ page.mark }}</div>
  <div class="ui-lab-overview-card__body">
    <div class="ui-lab-overview-card__header">
      <span class="ui-lab-overview-card__eyebrow">{{ page.label }}</span>
      <span class="ui-lab-status-pill ui-lab-status-pill--{{ page.status_modifier }}">
        {{ page.status_label }}
      </span>
    </div>
    <h2 class="ui-lab-overview-card__title">
      <a class="ui-lab-overview-card__link" href="{{ page.url }}">{{ page.title }}</a>
    </h2>
    <p class="ui-lab-overview-card__summary">{{ page.summary }}</p>
  </div>
</article>
