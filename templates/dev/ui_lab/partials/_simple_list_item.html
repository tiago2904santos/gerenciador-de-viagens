<div class="simple-list-item" role="listitem">
  <div class="simple-list-item__avatar" aria-hidden="true">{{ item.avatar }}</div>
  <div class="simple-list-item__body">
    <span class="simple-list-item__title">{{ item.title }}</span>
    <span class="simple-list-item__meta">{{ item.meta }}</span>
  </div>
  <div class="simple-list-item__aside">
    {% if compact_actions %}
      <div class="cv-icon-btn-group">
        <button class="cv-icon-btn cv-icon-btn--preview" type="button" aria-label="Visualizar {{ item.title }}" data-tooltip="Visualizar {{ item.title }}">
          {% include "dev/ui_lab/partials/_cv_icon.html" with icon="eye" only %}
        </button>
        <button class="cv-icon-btn cv-icon-btn--edit" type="button" aria-label="Editar {{ item.title }}" data-tooltip="Editar {{ item.title }}">
          {% include "dev/ui_lab/partials/_cv_icon.html" with icon="edit" only %}
        </button>
      </div>
    {% else %}
      <span class="ui-lab-demo-chip ui-lab-demo-chip--{{ item.status_modifier }}">{{ item.status_label }}</span>
      <button class="btn btn-secondary btn-sm" type="button">{{ item.action_label }}</button>
    {% endif %}
  </div>
</div>
