<article class="ui-lab-placeholder">
  <div class="ui-lab-placeholder__header">
    <span class="ui-lab-status-pill ui-lab-status-pill--{{ status_modifier }}">{{ status_label }}</span>
    <h2 class="ui-lab-placeholder__title">{{ title }}</h2>
    <p class="ui-lab-placeholder__description">{{ description }}</p>
  </div>
  {% if items %}
    <ul class="ui-lab-placeholder__list">
      {% for item in items %}
        <li class="ui-lab-placeholder__list-item">{{ item }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</article>
