{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{% static 'js/core/theme-shared.js' %}?v=20260512"></script>
  <script src="{% static 'js/core/theme-init.js' %}?v=20260512"></script>
  <title>{% block title %}{{ page_title|default:"Assinatura de documento" }}{% endblock %} — Central de Viagens</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260513">
  <link rel="stylesheet" href="{% static 'css/signature-public.css' %}?v=20260513">
  {% block extra_css %}{% endblock %}
</head>
<body class="signature-public-page">
  <main class="app-main signature-public-main">
    <section class="content-wrap">
      {% block content %}{% endblock %}
    </section>
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
