{% extends "base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/pages/oficios.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/termos.css' %}">
{% endblock %}

{% block content %}
  <div class="page-shell page-shell--standard-simple travel-document-wizard app-wizard document-form-page">
    <c-ui.headers.page_header eyebrow="TERMOS" :title="page_title" icon_label="TM" module_label="Termos" back_label="Editar termo" :back_url="editar_url" only />

    <div class="main-form-panel main-form-panel--stack travel-document-wizard__main">
      <div class="form-section-stack form-section-stack--comfortable">
        <c-form.card title="Resumo do termo" description="Dados efetivos usados na geração do documento" title_id="termo-preview-cadastro-title" body_template="termos/partials/_preview_cadastro_body.html" />
      </div>
    </div>
  </div>
{% endblock %}
