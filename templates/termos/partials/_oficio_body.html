<div class="termo-oficio-selector-wrapper">
  <div class="field-grid roteiro-sede-grid">
    <div class="field app-form-field field-size-2">
      <label class="app-form-label" for="id_oficio_busca">Buscar ofício vinculado</label>
      <input
        type="search"
        id="id_oficio_busca"
        class="form-control"
        placeholder="Buscar por número, protocolo, destino, sede, viatura ou servidor"
        autocomplete="off"
      >
    </div>
  </div>
  {{ form.oficio }}
  {% if form.oficio.errors %}
    {% include "components/ui/feedback/field_error.html" with errors=form.oficio.errors only %}
  {% endif %}
  <section class="cv-search-picker__selected-panel roteiro-routes-panel termo-oficio-summary-panel" aria-label="Ofícios encontrados">
    <div class="cv-search-picker__selected-header roteiro-routes-panel__header">
      <h3 class="cv-search-picker__selected-title">Ofícios encontrados</h3>
    </div>
    <div id="termo-oficio-lista" class="roteiro-editor__route-list oficio-roteiro-route-list roteiro-routes-list"></div>
  </section>
</div>
