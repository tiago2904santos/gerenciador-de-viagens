<div class="field-grid">
  <div class="field-size-4">
    {% if preview.erro %}
      <c-v2.alert tone="error" :message="preview.erro" />
    {% else %}
      <p class="section-header__description document-preview-heading"><strong>Servidores com Termo de Autorização</strong></p>
      <ul class="document-preview-list">
        {% for servidor in preview.servidores %}
          <li>{{ servidor.nome }}</li>
        {% empty %}
          <li>Nenhum servidor selecionado para Termo de Autorização neste ofício.</li>
        {% endfor %}
      </ul>
      <c-v2.button href="?format=json" label="Ver JSON" variant="secondary" icon="code" only />
    {% endif %}
  </div>
</div>
