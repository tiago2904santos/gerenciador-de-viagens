{% comment %}
  Corpo do card mestre do cadastro de termo (H-02/H-05).
{% endcomment %}
<c-ui.forms.form_block element_id="termo-block-oficio" section_id="termo-oficio-title" extra_class="travel-document-block document-form-block" title="Ofício vinculado" description="Opcional. Reaproveite destino, período, servidores e viatura de um ofício." body_extra_class="termo-block__body" body_template="termos/partials/_oficio_body.html" />

<c-ui.forms.form_block element_id="termo-block-evento" section_id="termo-evento-title" extra_class="travel-document-block document-form-block" title="Evento" description="Destino e período — obrigatórios quando não vierem do ofício." body_extra_class="form-stack termo-evento-body" body_template="termos/partials/_evento_body.html" />

<c-ui.forms.form_block element_id="termo-block-servidores" section_id="termo-servidores-title" variant="resource" extra_class="travel-document-block document-form-block" title="Equipe" description="Viajantes do termo. Com vários servidores, gera um termo para cada um." action_label="Novo viajante" :action_url="servidor_create_url" :action_autosave="True" body_template="termos/partials/_servidores_body.html" />

<c-ui.forms.form_block element_id="termo-block-viatura" section_id="termo-viatura-title" variant="resource" extra_class="travel-document-block document-form-block" title="Transporte" description="Opcional. Se vazio, pode usar a viatura do ofício vinculado." action_label="Nova viatura" :action_url="viatura_create_url" :action_autosave="True" body_template="termos/partials/_viatura_body.html" />

{% if termo and termo.pk %}
  <c-ui.forms.form_block element_id="termo-block-documentos" section_id="termo-documentos-title" data_hook="travel-document-wizard-documentos" extra_class="travel-document-block oficio-documentos-block document-form-block termo-documentos-preview oficio-documentos-preview-section document-inline-stack" title="Documentos para conferência" description="Visualize, baixe e anexe os termos assinados." body_extra_class="oficio-documentos-preview-section__body" body_template="termos/partials/_preview_body.html" />
{% endif %}
