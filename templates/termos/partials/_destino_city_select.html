<select
  class="cv-search-picker__native"
  data-cv-search-picker="true"
  data-picker-mode="single"
  data-picker-variant="compact"
  data-placeholder="Buscar cidade..."
  data-empty-message="Nenhuma cidade encontrada."
  data-picker-initial-value="{{ row.cidade_id }}"
  data-termo-destino-city
  name="{% if row.is_primary %}destino_cidade{% else %}destino_cidade_{{ row.index }}{% endif %}"
  {% if not row.estado_id %}disabled{% endif %}
>
  <option value=""></option>
  {% for cidade in row.cidades %}
    <option value="{{ cidade.pk }}"{% if row.cidade_id == cidade.pk|stringformat:'s' %} selected{% endif %}>{{ cidade.nome }}</option>
  {% endfor %}
</select>
