{% load icones %}
{% load static %}
{% comment %}
  A espera da prévia, dentro do `<iframe>`.

  Migrada para o v2 em 2026-08-20: era `document-generation-embedded*`, com uma
  folha de página só dela (80 linhas), e o assunto é o mesmo do aviso de
  download — documento em preparação. As duas passaram a ser
  `v2/document-loading.css`, e esta é a variante `--embedded`, que ocupa a tela
  em vez de flutuar sobre ela.

  Casca própria (sem `base.html`) porque a página vive dentro de um quadro: a
  barra lateral e o cabeçalho do sistema apareceriam duas vezes.
{% endcomment %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{% static 'js/core/theme-shared.js' %}"></script>
  <script src="{% static 'js/core/theme-init.js' %}"></script>
  <title>Preparando documento</title>
  <link rel="stylesheet" href="{% static 'css/shell.bundle.css' %}">
  <link rel="stylesheet" href="{% static 'css/ui.bundle.css' %}">
</head>
<body class="document-loading document-loading--embedded">
  <c-v2.sprite />
  {% comment %}
    Job já falhado não é espera (`NOVO-20260824-133423-ade2a3103cc3`): sem o
    desvio, o quadro mostrava girador e "aguarde um instante" para uma geração
    que o servidor recusou antes de começar.
  {% endcomment %}
  {% if geracao.error %}
    <main class="document-loading__panel">
      <span class="document-loading__mark" aria-hidden="true">
        {% icone_svg "document" %}
      </span>
      <p class="document-loading__eyebrow">Documento não gerado</p>
      <h1 class="document-loading__title">Não foi possível gerar a prévia</h1>
      <p class="document-loading__detail">{{ geracao.error }}</p>
    </main>
  {% else %}
    <main
      class="document-loading__panel"
      data-document-generation-wait
      data-status-url="{{ geracao.status_url }}"
    >
      <span class="document-loading__mark" aria-hidden="true">
        {% icone_svg "document" %}
      </span>
      <span class="document-loading__spinner" aria-hidden="true"></span>
      <p class="document-loading__eyebrow">Documento em preparação</p>
      <h1 class="document-loading__title">Gerando a prévia do plano</h1>
      <p class="document-loading__detail" data-document-generation-message>
        Aguarde um instante. O documento será exibido aqui automaticamente.
      </p>
    </main>
    <script src="{% static 'js/core/http.js' %}" defer></script>
    <script src="{% static 'js/components/document-generation-wait.js' %}" defer></script>
  {% endif %}
</body>
</html>
