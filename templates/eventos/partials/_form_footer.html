<div class="card-footer-section">
  <div class="card-footer-section__divider" aria-hidden="true"></div>
  <footer class="card-footer">
    <div class="card-footer__secondary">
      <c-ui.buttons.button :href="index_url" label="Cancelar" variant="secondary" icon="arrow-left" only />
      {% if panel_url %}
        <c-ui.buttons.button :href="panel_url" label="Abrir painel do evento" variant="secondary" only />
      {% endif %}
    </div>
    <div class="card-footer__primary">
      <c-ui.buttons.button type="submit" label="Salvar evento" variant="primary" icon="arrow-right" :icon_after="True" only />
    </div>
  </footer>
</div>
