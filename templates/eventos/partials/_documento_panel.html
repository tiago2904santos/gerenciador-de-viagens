<section
  class="evento-doc-panel"
  data-doc-tab-panel="{{ panel_key }}"
  {% if hidden %}hidden{% endif %}
>
  <div class="cv-search-picker cv-search-picker--single cv-search-picker--detailed cv-search-picker--people cv-search-picker--roster evento-doc-source-picker">
    <div class="cv-search-picker__field">
      <div class="cv-search-picker__label">{{ label }}</div>
      <div class="cv-search-picker__control">
        <span class="cv-search-picker__icon" aria-hidden="true"></span>
        <input
          type="search"
          id="id_evento_doc_busca_{{ panel_key }}"
          class="cv-search-picker__input"
          placeholder="{{ placeholder }}"
          autocomplete="off"
          role="searchbox"
          aria-label="{{ label }}"
          data-evento-doc-search="{{ panel_key }}"
        >
      </div>
    </div>
    {{ field }}
    {% if field.errors %}
      {% include "components/ui/feedback/field_error.html" with errors=field.errors only %}
    {% endif %}
    <section class="cv-search-picker__selected-panel evento-doc-summary-panel" aria-label="Documentos encontrados">
      <div class="cv-search-picker__selected-list roteiro-editor__route-list related-route-list related-route-list" data-evento-doc-list="{{ panel_key }}"></div>
      <p class="cv-search-picker__selected-empty" data-evento-doc-empty="{{ panel_key }}" hidden>{{ empty }}</p>
    </section>
  </div>
</section>
