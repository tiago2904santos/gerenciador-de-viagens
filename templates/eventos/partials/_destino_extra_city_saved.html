<select
  class="cv-search-picker__native"
  data-cv-search-picker="true"
  data-picker-mode="single"
  data-picker-variant="compact"
  data-placeholder="Buscar cidade..."
  data-empty-message="Nenhuma cidade encontrada."
  data-destino-cidade-extra
  data-initial-value="{{ destino.cidade|default:'' }}"
  aria-label="Cidade"
  disabled
>
  <option value="">---------</option>
  {% if destino.cidade %}<option value="{{ destino.cidade }}" selected>{{ destino.cidade }}</option>{% endif %}
</select>
