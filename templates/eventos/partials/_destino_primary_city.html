<select
  name="destino_cidade"
  class="cv-search-picker__native"
  data-cv-search-picker="true"
  data-picker-mode="single"
  data-picker-variant="compact"
  data-placeholder="Buscar cidade..."
  data-empty-message="Nenhuma cidade encontrada."
  data-destino-cidade-picker
  id="{{ form.destino_cidade.id_for_label }}"
  data-initial-value="{{ form.destino_cidade.value|default:'' }}"
  disabled
>
  <option value="">---------</option>
</select>
{% if form.destino_cidade.errors %}
  {% include "components/ui/feedback/field_error.html" with errors=form.destino_cidade.errors only %}
{% endif %}
