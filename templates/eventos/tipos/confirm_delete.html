{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="page-shell page-shell--standard-simple">
    <c-ui.headers.page_header eyebrow="EVENTOS" :title="page_title" :description="page_description" icon_label="EV" module_label="Tipos de Evento" only />
    <form class="main-form-panel" method="post">
      {% csrf_token %}
      <c-feedback.confirm_delete_block :object_label="object.nome" message="Esta ação remove o tipo da lista de seleção, mas não altera eventos já criados." primary_label="Excluir tipo" :back_url="back_url" only />
    </form>
  </div>
{% endblock %}
