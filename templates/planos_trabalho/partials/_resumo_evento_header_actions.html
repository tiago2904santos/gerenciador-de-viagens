{% if mostrar_acoes and ev.editar_url %}
  <div class="pt-resumo-card-actions">
    {# formaction: os botões vivem dentro do <form> do wizard (sem forms aninhados). #}
    <c-ui.buttons.button type="submit" formmethod="post" formaction="{{ ev.editar_url }}" formnovalidate
            class_name="icon-btn icon-btn--edit" aria_label="Editar evento" data-tooltip="Editar evento" only>
      <c-ui.icons.icon icon="edit" only />
    </c-ui.buttons.button>
    <c-ui.buttons.button type="submit" formmethod="post" formaction="{{ ev.excluir_url }}" formnovalidate
            data-confirm-submit data-confirm-message="Remover este evento do plano?"
            class_name="icon-btn icon-btn--delete" aria_label="Remover evento" data-tooltip="Remover evento" only>
      <c-ui.icons.icon icon="delete" only />
    </c-ui.buttons.button>
  </div>
{% endif %}
