{% comment %}
  A composição da equipe. Cada linha é um `c-v2.efetivo_row`; o `<template>` no
  fim é o molde que `js/pages/planos-trabalho-wizard.js` clona ao clicar no "+",
  trocando `__prefix__` pelo índice do formset.

  `data-pt-efetivo-rows` é a lista que o motor observa, e `management_form` é o
  que diz ao Django quantas linhas vieram. As duas coisas precisam continuar
  irmãs: o motor incrementa `TOTAL_FORMS` a cada linha nova.
{% endcomment %}
{{ formset.management_form }}
<c-v2.form_errors :errors="formset.non_form_errors" />

<div class="efetivo-rows" aria-label="Efetivos adicionados" data-pt-efetivo-rows>
  {% for efetivo_form in formset %}
    {% if forloop.first and formset|length == 1 %}
      <c-v2.efetivo_row :form="efetivo_form" :ordinal="forloop.counter" :cargos_url="cargos_url" :removable="False" :show_labels="True" />
    {% elif forloop.first %}
      <c-v2.efetivo_row :form="efetivo_form" :ordinal="forloop.counter" :cargos_url="cargos_url" :removable="True" :show_labels="True" />
    {% else %}
      <c-v2.efetivo_row :form="efetivo_form" :ordinal="forloop.counter" :cargos_url="cargos_url" :removable="True" :show_labels="False" />
    {% endif %}
  {% endfor %}
</div>

<template data-pt-efetivo-template>
  <c-v2.efetivo_row :form="formset.empty_form" :ordinal="1" :cargos_url="cargos_url" :removable="True" :show_labels="False" />
</template>
