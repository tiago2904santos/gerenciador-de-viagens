<div class="field-grid">
  <div class="field-size-4">
    <c-ui.forms.field :field="form.nome" only />
  </div>
</div>
<div class="field-grid">
  <div class="field-size-4">
    <div class="field app-form-field cv-field pt-preset-activities-field">
      <section class="pt-preset-activities-panel" aria-labelledby="pt-preset-activities-title">
        <header class="pt-preset-activities-panel__header">
          <h3 class="pt-preset-activities-panel__title" id="pt-preset-activities-title">Atividades previstas</h3>
          <p class="pt-preset-activities-panel__description">Clique nas atividades para incluí-las ou retirá-las deste preset.</p>
        </header>
        {{ form.atividades }}
      </section>
      {% if form.atividades.errors %}
        <c-ui.feedback.field_error :errors="form.atividades.errors" :field_id="form.atividades.auto_id" only />
      {% endif %}
    </div>
  </div>
</div>
