<div class="field-grid">
  <div class="field-size-4">
    <c-ui.forms.field :field="form.nome" only />
  </div>
</div>
<div class="field-grid">
  <div class="field-size-4">
    <div class="field app-form-field cv-field pt-preset-activities-field">
      <fieldset class="pt-preset-activities-panel" aria-describedby="{{ form.atividades.auto_id }}_helptext">
        <legend class="pt-preset-activities-panel__title">Atividades previstas</legend>
        <p class="pt-preset-activities-panel__description" id="{{ form.atividades.auto_id }}_helptext">{{ form.atividades.help_text }}</p>
        {{ form.atividades }}
      </fieldset>
      {% if form.atividades.errors %}
        <c-ui.feedback.field_error :errors="form.atividades.errors" :field_id="form.atividades.auto_id" only />
      {% endif %}
    </div>
  </div>
</div>
