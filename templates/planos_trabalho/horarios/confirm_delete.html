{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="page-shell page-shell--standard-simple">
    <c-ui.headers.page_header eyebrow="PLANOS DE TRABALHO" :title="page_title" :description="page_description" icon_label="PT" module_label="Horários de Atendimento" only />
    <form class="main-form-panel" method="post">
      {% csrf_token %}
      <c-feedback.confirm_delete_block :object_label="horario.faixa" message="Planos já criados que usam este horário não são alterados." primary_label="Excluir horário" :back_url="cancel_url" only />
    </form>
  </div>
{% endblock %}
