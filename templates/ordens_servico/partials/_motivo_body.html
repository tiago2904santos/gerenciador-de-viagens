<div class="field-grid">
  <fieldset class="os-model-picker field-size-4" data-os-model-picker>
    <legend class="cv-field__label">Modelo de OS</legend>
    <div class="os-model-picker__grid">
      {% for radio in form.tipo_necessidade %}
        <label class="os-model-card" for="{{ radio.id_for_label }}">
          {{ radio.tag }}
          <span class="os-model-card__mark" aria-hidden="true"></span>
          <span class="os-model-card__body">
            <span class="os-model-card__title">{{ radio.choice_label }}</span>
            {% if radio.data.value == "OPERACAO_RETORNO_POSTERIOR" %}
              <span class="os-model-card__hint">Justifica permanência da equipe policial um dia após a operação.</span>
            {% elif radio.data.value == "CAMINHAO" %}
              <span class="os-model-card__hint">Inclui motorista, técnico e apoios de montagem/escolta, com dois dias antes e depois.</span>
            {% elif radio.data.value == "MICROONIBUS" %}
              <span class="os-model-card__hint">Inclui motorista, técnico e apoios de montagem/escolta, sem regra de dois dias.</span>
            {% elif radio.data.value == "CERIMONIAL_ANTECIPADO" %}
              <span class="os-model-card__hint">Justifica ida antecipada da equipe de cerimonial para organizar a solenidade.</span>
            {% else %}
              <span class="os-model-card__hint">Mantém o texto livre usado nas OS atuais.</span>
            {% endif %}
          </span>
        </label>
      {% endfor %}
    </div>
    {% if form.tipo_necessidade.errors %}{% include "components/ui/feedback/field_error.html" with errors=form.tipo_necessidade.errors only %}{% endif %}
  </fieldset>
</div>
