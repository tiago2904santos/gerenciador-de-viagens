<div class="field-grid">
  <c-ui.forms.field :field="form.modelo_motivo" :action_url="modelos_motivo_url" action_label="Gerenciar modelos" size_class="field-size-4" only />
  {% if not tem_modelos_motivo %}
    <div class="field field-size-4">
      <p class="field-help">Nenhum modelo cadastrado. <a href="{{ modelos_motivo_url }}">Abrir gerenciamento de modelos</a></p>
    </div>
  {% endif %}
  <div class="field field-size-4 app-form-field cv-field oficio-motivo-field oficio-reveal-panel is-open">
    <label class="cv-field__label" for="{{ form.motivo.id_for_label }}">Motivo</label>
    {{ form.motivo }}
    {% if form.motivo.errors %}<c-ui.feedback.field_error :errors="form.motivo.errors" :field_id="form.motivo.auto_id" only />{% endif %}
  </div>
</div>
