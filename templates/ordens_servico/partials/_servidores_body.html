{% include "components/ui/forms/field.html" with field=form.servidores only %}
<section
  class="os-servidor-role-panel"
  data-os-model-fields="CAMINHAO MICROONIBUS CERIMONIAL_ANTECIPADO"
  data-os-servidor-role-panel
  hidden
>
  {# Mesmo ritmo de Documentos vinculados (eventos): toggle → busca → lista. #}
  <div class="cv-segment-toggle os-servidor-role-panel__toggle" role="group" aria-label="Função dos servidores no caminhão">
    <button type="button" class="cv-segment-toggle__btn" data-os-role-mode="CONDUCAO" aria-pressed="true">Condução</button>
    <button type="button" class="cv-segment-toggle__btn" data-os-role-mode="TECNICO" aria-pressed="false">Técnico</button>
    <button type="button" class="cv-segment-toggle__btn" data-os-role-mode="APOIO" aria-pressed="false">Apoio</button>
  </div>
  <div class="os-servidor-role-panel__picker" data-os-servidor-picker-field-host></div>
</section>
