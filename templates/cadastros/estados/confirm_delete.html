{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <div class="page-shell page-shell--standard-simple">
    <c-ui.headers.page_header eyebrow="CADASTROS" :title="page_title" :description="page_description" icon_label="UF" module_label="Cadastros" only />
    <form class="main-form-panel" method="post">
      {% csrf_token %}
      <c-feedback.confirm_delete_block :object_label="object.nome" primary_label="Excluir estado" message="Não é possível excluir se existirem cidades vinculadas." :back_url="back_url" only />
    </form>
  </div>
{% endblock %}
