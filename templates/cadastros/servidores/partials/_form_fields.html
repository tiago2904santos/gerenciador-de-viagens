{% comment %}
  Identificação do servidor. O RG tem invólucro próprio (`data-rg-field-wrap`):
  `servidores-form.js` o esconde quando "sem RG" está marcado.
{% endcomment %}
<div class="field-grid">
  <c-v2.form_field :field="form.nome" extra_class="field--wide" />
  <c-v2.field :label="form.cargo.label" :label_for="form.cargo.id_for_label" :error="form.cargo.errors.0">
    <c-slot name="control">
      <c-v2.select_with_action
        :field="form.cargo"
        :action_href="cargos_manage_url"
        action_icon="settings"
        action_aria_label="Gerenciar cargos"
        action_tooltip="Gerenciar cargos"
        :action_autosave="True"
      />
    </c-slot>
  </c-v2.field>
  <c-v2.form_field :field="form.cpf" />
  <c-v2.form_field :field="form.telefone" />
  <div data-rg-field-wrap>
    <c-v2.form_field :field="form.rg" />
  </div>
</div>
