{% comment %}
  `form.uf` sai SOZINHO, sem campo em volta: é o oculto que guarda a sigla que o
  `configuracoes.js` preenche a partir do CEP. O que a pessoa vê é `uf_nome`.
{% endcomment %}
<div class="field-grid">
  <c-v2.form_field :field="form.cep" />
  <c-v2.form_field :field="form.numero" />
  <c-v2.form_field :field="form.logradouro" extra_class="field--wide" />
  <c-v2.form_field :field="form.bairro" extra_class="field--wide" />
  <c-v2.form_field :field="form.cidade_endereco" />
  <c-v2.form_field :field="form.uf_nome" />
  {{ form.uf }}
  <c-v2.form_field :field="form.email" extra_class="field--wide" />
  <c-v2.form_field :field="form.telefone" />
  <c-v2.form_field :field="form.ramal" />
</div>
