<header class="ui-lab-hero">
  <div class="ui-lab-hero__copy">
    <p class="ui-lab-hero__eyebrow">UI Lab 2.0 · Catalogo por funcao</p>
    <h1 class="ui-lab-hero__title">{{ ui_lab2_current.title|default:"UI Lab 2.0" }}</h1>
    <p class="ui-lab-hero__subtitle">{{ ui_lab2_current.subtitle|default:"Componentes reais do sistema, clonados e organizados por funcao, com a lista de onde cada um e usado." }}</p>
  </div>
  <div class="ui-lab-hero__meta">
    {% if ui_lab2_current %}
      <span class="ui-lab-status-pill ui-lab-status-pill--{{ ui_lab2_current.status_modifier }}">
        {{ ui_lab2_current.status_label }}
      </span>
    {% endif %}
  </div>
</header>
