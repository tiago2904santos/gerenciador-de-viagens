{% if used_in %}
  <div class="ui-lab2-usage">
    <p class="ui-lab2-usage__title">Usado em <span class="ui-lab2-usage__count">{{ used_in|length }}</span></p>
    <ul class="ui-lab2-usage__list">
      {% for path in used_in %}
        <li><code>{{ path }}</code></li>
      {% endfor %}
    </ul>
  </div>
{% else %}
  <div class="ui-lab2-usage ui-lab2-usage--empty">
    <p class="ui-lab2-usage__title">Componente canonico — reutilizado via include nas paginas.</p>
  </div>
{% endif %}
