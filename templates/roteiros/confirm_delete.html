{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <div class="page-shell page-shell--standard-simple">
    <c-ui.headers.page_header eyebrow="ROTEIROS" :title="page_title" :description="page_description" icon_label="RT" module_label="Roteiros" only />
    <form class="main-form-panel" method="post">
      {% csrf_token %}
      <c-feedback.confirm_delete_block :object_label="object" message="Esta ação excluirá o roteiro e destinos/trechos vinculados. Se houver vínculos com outros registros, a exclusão será bloqueada." primary_label="Excluir roteiro" :back_url="back_url" only />
    </form>
  </div>
{% endblock %}
