<div class="destino-row oficio-roteiro-destino-row"
     data-destinos-row
     data-index="__index__">
  <span class="oficio-roteiro-destino-row__badge" data-destino-ord aria-hidden="true">1</span>
  <div class="oficio-roteiro-destino-row__body">
    <div class="field-grid roteiro-sede-grid roteiro-destino-grid oficio-roteiro-destino-row__fields">
      <div class="field app-form-field">
        {% include "roteiros/partials/roteiro/_destino_template_state.html" %}
      </div>
      <div class="field app-form-field">
        {% include "roteiros/partials/roteiro/_destino_template_city.html" %}
      </div>
    </div>
  </div>
  <button type="button"
          class="btn-remover-destino oficio-roteiro-destino-row__remove"
          title="Remover destino"
          aria-label="Remover destino">×</button>
</div>
