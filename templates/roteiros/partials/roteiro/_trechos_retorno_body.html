{# Avulso: trechos + retorno no mesmo card (stack plano). No ofício viram blocos irmãos. #}
<div class="roteiro-deslocamentos-stack">
  <div id="trechos-gerados-container" class="roteiro-trechos-stack">
    {% include "roteiros/partials/roteiro/_trechos_body.html" only %}
  </div>

  <div class="roteiro-trecho-card roteiro-deslocamento roteiro-deslocamento--retorno" id="retorno-card">
    <div class="roteiro-leg-label">
      <span class="roteiro-leg-label__num">Retorno</span>
      <span class="roteiro-leg-label__route">Último deslocamento até a sede</span>
    </div>
    <div class="roteiro-deslocamento__body">
      {% include "roteiros/partials/roteiro/_retorno_body.html" with retorno_state=retorno_state only %}
    </div>
  </div>
</div>
