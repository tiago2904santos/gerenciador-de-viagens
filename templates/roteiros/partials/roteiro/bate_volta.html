{# SEÇÃO 3: BATE-VOLTA #}
<section class="cv-wizard-section-card roteiro-editor__section--bate-volta" aria-labelledby="sec-bate-volta">
  <header class="cv-wizard-section-header">
    <div class="cv-wizard-section-header__copy">
      <h3 class="cv-wizard-section-title" id="sec-bate-volta">3. Modo bate-volta diário</h3>
      <p class="cv-wizard-section-subtitle">Gerador automático de loop diário</p>
    </div>
    <div class="cv-wizard-section-header__actions">
      <span class="cv-chip cv-chip--neutral roteiro-editor__chip" id="bate-volta-status-chip" aria-hidden="true">Inativo</span>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" role="switch"
               id="id_bate_volta_diario_ativo" name="bate_volta_diario_ativo"
               {% if roteiro_editor_state_json.bate_volta_diario.ativo %}checked{% endif %}>
        <label class="form-check-label" for="id_bate_volta_diario_ativo">Ativar bate-volta diário</label>
      </div>
    </div>
  </header>
  <div class="cv-wizard-section-body">
    <div id="bate-volta-panel" class="field-grid field-grid--cols-4">
      <div class="field field-size-1">
        <label class="roteiro-editor__field-label" for="id_bate_volta_data_inicio">Data inicial</label>
        <input type="date" class="app-form-field" id="id_bate_volta_data_inicio" name="bate_volta_data_inicio"
               value="{{ roteiro_editor_state_json.bate_volta_diario.data_inicio|default:'' }}">
      </div>
      <div class="field field-size-1">
        <label class="roteiro-editor__field-label" for="id_bate_volta_ida_saida_hora">Saída da ida</label>
        <input type="time" class="app-form-field" id="id_bate_volta_ida_saida_hora" name="bate_volta_ida_saida_hora"
               value="{{ roteiro_editor_state_json.bate_volta_diario.ida_saida_hora|default:'' }}">
      </div>
      <div class="field field-size-1">
        <label class="roteiro-editor__field-label" for="id_bate_volta_ida_tempo_hhmm">Tempo da ida</label>
        <input type="text" class="app-form-field" id="id_bate_volta_ida_tempo_hhmm"
               value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
        <input type="hidden" id="id_bate_volta_ida_tempo_min" name="bate_volta_ida_tempo_min"
               value="{{ roteiro_editor_state_json.bate_volta_diario.ida_tempo_min|default:'' }}">
      </div>
      <div class="field field-size-1">
        <label class="roteiro-editor__field-label" for="id_bate_volta_data_fim">Data final</label>
        <input type="date" class="app-form-field" id="id_bate_volta_data_fim" name="bate_volta_data_fim"
               value="{{ roteiro_editor_state_json.bate_volta_diario.data_fim|default:'' }}">
      </div>
      <div class="field field-size-1">
        <label class="roteiro-editor__field-label" for="id_bate_volta_volta_saida_hora">Saída da volta</label>
        <input type="time" class="app-form-field" id="id_bate_volta_volta_saida_hora" name="bate_volta_volta_saida_hora"
               value="{{ roteiro_editor_state_json.bate_volta_diario.volta_saida_hora|default:'' }}">
      </div>
      <div class="field field-size-1">
        <label class="roteiro-editor__field-label" for="id_bate_volta_volta_tempo_hhmm">Tempo da volta</label>
        <input type="text" class="app-form-field" id="id_bate_volta_volta_tempo_hhmm"
               value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
        <input type="hidden" id="id_bate_volta_volta_tempo_min" name="bate_volta_volta_tempo_min"
               value="{{ roteiro_editor_state_json.bate_volta_diario.volta_tempo_min|default:'' }}">
      </div>
      <div class="field field-size-4">
        <p class="roteiro-editor__helper mb-0">Use exatamente um destino operacional quando este modo estiver ativo. O retorno final também será refletido no bloco de retorno abaixo.</p>
      </div>
    </div>
  </div>
</section>
