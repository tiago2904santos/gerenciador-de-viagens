{% if has_event_routes %}
  <div class="segment-toggle" role="group" aria-label="Modo do roteiro" id="roteiro-modo-toggle">
    <c-ui.buttons.button type="button"
            class_name="segment-toggle__btn"
            id="toggle-btn-salvo"
            aria-pressed="{% if roteiro_modo == 'EVENTO_EXISTENTE' %}true{% else %}false{% endif %}"
            data-roteiro-toggle="EVENTO_EXISTENTE" only>
      <span>Roteiro salvo</span>
    </c-ui.buttons.button>
    <c-ui.buttons.button type="button"
            class_name="segment-toggle__btn"
            id="toggle-btn-novo"
            aria-pressed="{% if roteiro_modo != 'EVENTO_EXISTENTE' %}true{% else %}false{% endif %}"
            data-roteiro-toggle="ROTEIRO_PROPRIO" only>
      <span>Roteiro novo</span>
    </c-ui.buttons.button>
  </div>
{% endif %}
