{# SEÇÃO 6: RETORNO #}
<section class="cv-wizard-section-card roteiro-editor__section--retorno" aria-labelledby="sec-retorno">
  <header class="cv-wizard-section-header">
    <div class="cv-wizard-section-header__copy">
      <h3 class="cv-wizard-section-title" id="sec-retorno">6. Retorno final</h3>
    </div>
  </header>
  <div class="cv-wizard-section-body" id="retorno-card">

    {# Saída #}
    <div class="wizard-inner-section">
      <div class="wizard-inner-section__header">
        <h4 class="wizard-inner-section__title">Saída</h4>
      </div>
      <div class="field-grid field-grid--cols-3">
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_saida_cidade">Cidade de saída</label>
          <input type="text" id="id_retorno_saida_cidade" class="app-form-field"
                 value="{{ retorno_state.saida_cidade|default:'' }}" readonly>
        </div>
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_saida_data">Data</label>
          <input type="date" name="retorno_saida_data" id="id_retorno_saida_data" class="app-form-field"
                 value="{{ retorno_state.saida_data|default:'' }}">
        </div>
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_saida_hora">Hora</label>
          <input type="time" name="retorno_saida_hora" id="id_retorno_saida_hora" class="app-form-field"
                 value="{{ retorno_state.saida_hora|default:'' }}">
        </div>
      </div>
    </div>

    {# Chegada #}
    <div class="wizard-inner-section">
      <div class="wizard-inner-section__header">
        <h4 class="wizard-inner-section__title">Chegada</h4>
      </div>
      <div class="field-grid field-grid--cols-3">
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_chegada_cidade">Cidade de chegada</label>
          <input type="text" id="id_retorno_chegada_cidade" class="app-form-field"
                 value="{{ retorno_state.chegada_cidade|default:'' }}" readonly>
        </div>
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_chegada_data">Data</label>
          <input type="date" name="retorno_chegada_data" id="id_retorno_chegada_data" class="app-form-field"
                 value="{{ retorno_state.chegada_data|default:'' }}">
        </div>
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_chegada_hora">Hora</label>
          <input type="time" name="retorno_chegada_hora" id="id_retorno_chegada_hora" class="app-form-field"
                 value="{{ retorno_state.chegada_hora|default:'' }}">
        </div>
      </div>
    </div>

    {# Tempo de viagem #}
    <div class="wizard-inner-section">
      <div class="wizard-inner-section__header">
        <h4 class="wizard-inner-section__title">Tempo de viagem</h4>
      </div>
      <div class="field-grid field-grid--cols-3 oficio-roteiro-time-calc-grid">
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_tempo_viagem_hhmm">Tempo de viagem</label>
          <input type="text" class="app-form-field" id="id_retorno_tempo_viagem_hhmm"
                 value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
          <input type="hidden" name="retorno_tempo_cru_estimado_min" id="id_retorno_tempo_cru_estimado_min"
                 value="{{ retorno_state.tempo_cru_estimado_min|default:'' }}">
        </div>
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_tempo_adicional_hhmm">Tempo adicional</label>
          <div class="input-group">
            <button type="button" class="cv-btn cv-btn--secondary"
                    id="retorno_tempo_add_menos" data-tempo-add-delta="-15" aria-label="Menos 15 minutos">−</button>
            <input type="text" class="app-form-field" id="id_retorno_tempo_adicional_hhmm"
                   value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
            <button type="button" class="cv-btn cv-btn--secondary"
                    id="retorno_tempo_add_mais" data-tempo-add-delta="15" aria-label="Mais 15 minutos">+</button>
          </div>
          <input type="hidden" name="retorno_tempo_adicional_min" id="id_retorno_tempo_adicional_min"
                 value="{{ retorno_state.tempo_adicional_min|default:0 }}">
        </div>
        <div class="field field-size-1">
          <label class="roteiro-editor__field-label" for="id_retorno_tempo_total">Tempo total</label>
          <input type="text" class="app-form-field" id="id_retorno_tempo_total" value="" readonly>
        </div>
      </div>
      <input type="hidden" name="retorno_distancia_km" id="id_retorno_distancia_km"
             value="{{ retorno_state.distancia_km|default:'' }}">
      <input type="hidden" name="retorno_duracao_estimada_min" id="id_retorno_duracao_estimada_min"
             value="{{ retorno_state.duracao_estimada_min|default:'' }}">
      <input type="hidden" name="retorno_rota_fonte" id="id_retorno_rota_fonte"
             value="{{ retorno_state.rota_fonte|default:'' }}">
      <div class="roteiro-editor__helper text-danger d-none" id="retorno-erro"></div>
    </div>

  </div>
</section>
