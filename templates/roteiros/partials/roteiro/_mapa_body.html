<p class="roteiro-mapa__stale-hint text-warning-emphasis small"
   id="roteiro-mapa-stale-hint"
   hidden
   role="status">
  A ordem dos destinos mudou. Recalcule a rota para atualizar distância e tempo estimados.
</p>

<div class="roteiro-mapa__metrics field-grid field-grid--cols-4" id="roteiro-mapa-summary">
  <div class="field cv-field cv-field--readonly field-size-1">
    <label class="cv-field__label" for="roteiro-mapa-distancia">Distância (ida e volta)</label>
    <input type="text"
           class="cv-field__control"
           id="roteiro-mapa-distancia"
           value="—"
           readonly
           tabindex="-1"
           aria-readonly="true"
           aria-describedby="roteiro-mapa-distancia-hint">
  </div>
  <div class="field cv-field cv-field--readonly field-size-1">
    <label class="cv-field__label" for="roteiro-mapa-tempo">Tempo (ida e volta)</label>
    <input type="text"
           class="cv-field__control"
           id="roteiro-mapa-tempo"
           value="—"
           readonly
           tabindex="-1"
           aria-readonly="true"
           aria-describedby="roteiro-mapa-tempo-hint">
  </div>
  <div class="field cv-field cv-field--readonly field-size-1">
    <label class="cv-field__label" for="roteiro-mapa-distancia-ida">Distância de ida</label>
    <input type="text"
           class="cv-field__control"
           id="roteiro-mapa-distancia-ida"
           value="—"
           readonly
           tabindex="-1"
           aria-readonly="true">
  </div>
  <div class="field cv-field cv-field--readonly field-size-1">
    <label class="cv-field__label" for="roteiro-mapa-tempo-ida">Tempo de ida</label>
    <input type="text"
           class="cv-field__control"
           id="roteiro-mapa-tempo-ida"
           value="—"
           readonly
           tabindex="-1"
           aria-readonly="true">
  </div>
</div>

<div class="roteiro-mapa__canvas-shell">
  <div class="roteiro-mapa__canvas-head"
       role="toolbar"
       aria-label="Ações do mapa da rota">
    <div class="roteiro-mapa__actions roteiro-mapa__actions--canvas">
      <c-ui.buttons.button type="button"
              class_name="cv-btn cv-btn--secondary"
              id="btn-calcular-rota-mapa" only>
        <span class="cv-btn__icon" aria-hidden="true"><c-ui.icons.icon icon="route" only /></span>
        <span>Calcular rota</span>
      </c-ui.buttons.button>
      <c-ui.buttons.button type="button"
              class_name="cv-btn cv-btn--secondary"
              id="btn-recalcular-rota-mapa"
              hidden only>
        <span class="cv-btn__icon" aria-hidden="true"><c-ui.icons.icon icon="route" only /></span>
        <span>Recalcular rota</span>
      </c-ui.buttons.button>
      <c-ui.buttons.button type="button"
              class_name="cv-btn cv-btn--secondary"
              id="btn-fit-rota-mapa"
              hidden only>
        Ver rota inteira
      </c-ui.buttons.button>
    </div>
  </div>

  <div class="roteiro-mapa__frame roteiro-mapa__frame--placeholder"
       id="roteiro-mapa-container"
       data-testid="roteiro-mapa-container"></div>

  <div class="roteiro-mapa__loading"
       id="roteiro-mapa-loading"
       hidden
       role="status"
       aria-live="polite">
    <span class="roteiro-mapa__loading-spinner" aria-hidden="true"></span>
    <span class="roteiro-mapa__loading-text">Calculando rota…</span>
  </div>
</div>

<div class="roteiro-mapa__error alert alert-warning py-2 small"
     id="roteiro-mapa-error"
     hidden
     role="alert"></div>
