<div id="bate-volta-body" {% if not roteiro_editor_state_json.bate_volta_diario.ativo %}hidden{% endif %}>
  {% if roteiro_editor_oficio %}
  <div id="bate-volta-panel" class="oficio-roteiro-bate-volta">
    {# Sem `only`: o partial de controles precisa de roteiro_editor_state_json + panel_id. #}
    <c-ui.forms.date_picker mode="range" picker_id="bate-volta-date-picker" extra_class="oficio-roteiro-bate-volta__picker" range_controls_template="roteiros/partials/roteiro/_bate_volta_date_controls.html" start_hidden_id="id_bate_volta_data_inicio_native" end_hidden_id="id_bate_volta_data_fim_native" start_hidden_name="bate_volta_data_inicio" end_hidden_name="bate_volta_data_fim" :start_hidden_value="roteiro_editor_state_json.bate_volta_diario.data_inicio" :end_hidden_value="roteiro_editor_state_json.bate_volta_diario.data_fim" :initial_date="roteiro_editor_state_json.bate_volta_diario.data_inicio" :show_summary="False"  :allow_repeat_dates="allow_repeat_dates" :compact_range_display="compact_range_display" :control_variant="control_variant" :end_field="end_field" :end_input_id="end_input_id" :end_label="end_label" :end_placeholder="end_placeholder" :filter_date="filter_date" :hide_labels="hide_labels" :input_class="input_class" :max_dates="max_dates" :multi_input_id="multi_input_id" :multi_placeholder="multi_placeholder" :selected_dates_json="selected_dates_json" :show_confirm="show_confirm" :show_context="show_context" :single_aria_label="single_aria_label" :single_field="single_field" :single_hidden_id="single_hidden_id" :single_hidden_name="single_hidden_name" :single_hidden_value="single_hidden_value" :single_input_id="single_input_id" :single_label="single_label" :single_placeholder="single_placeholder" :start_field="start_field" :start_input_id="start_input_id" :start_label="start_label" :start_placeholder="start_placeholder" :trecho_date="trecho_date" :trigger_aria_label="trigger_aria_label" :trigger_class="trigger_class" :trigger_label="trigger_label" :end_default_id="end_default_id" :end_id="end_id" :end_lbl="end_lbl" :end_ph="end_ph" :single_default_id="single_default_id" :single_id="single_id" :single_lbl="single_lbl" :start_default_id="start_default_id" :start_id="start_id" :start_lbl="start_lbl" :start_ph="start_ph" :roteiro_editor_state_json="roteiro_editor_state_json" />
  </div>
  {% else %}
  <div id="bate-volta-panel" class="roteiro-editor__bate-volta-grid-v2">

    {# O intervalo usa o modelo global; os horarios permanecem campos independentes. #}
    <c-ui.forms.date_picker mode="range" picker_id="bate-volta-date-picker" start_label="Data inicial" end_label="Data final" start_input_id="id_bate_volta_data_inicio_display" end_input_id="id_bate_volta_data_fim_display" start_hidden_id="id_bate_volta_data_inicio_native" end_hidden_id="id_bate_volta_data_fim_native" start_hidden_name="bate_volta_data_inicio" end_hidden_name="bate_volta_data_fim" :start_hidden_value="roteiro_editor_state_json.bate_volta_diario.data_inicio" :end_hidden_value="roteiro_editor_state_json.bate_volta_diario.data_fim" :initial_date="roteiro_editor_state_json.bate_volta_diario.data_inicio" only />

    <div class="field-grid field-grid--cols-2">
        <div class="field cv-field field-size-1">
          <label class="cv-field__label" for="id_bate_volta_ida_saida_hora">Saída da ida</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_ida_saida_hora" name="bate_volta_ida_saida_hora" data-mask="time"
                 value="{{ roteiro_editor_state_json.bate_volta_diario.ida_saida_hora|default:'' }}"
                 placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
        </div>
        <div class="field cv-field field-size-1">
          <label class="cv-field__label" for="id_bate_volta_ida_tempo_hhmm">Tempo da ida</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_ida_tempo_hhmm" data-mask="time"
                 value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
          <input type="hidden" id="id_bate_volta_ida_tempo_min" name="bate_volta_ida_tempo_min"
                 value="{{ roteiro_editor_state_json.bate_volta_diario.ida_tempo_min|default:'' }}">
        </div>
        <div class="field cv-field field-size-1">
          <label class="cv-field__label" for="id_bate_volta_volta_saida_hora">Saída da volta</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_volta_saida_hora" name="bate_volta_volta_saida_hora" data-mask="time"
                 value="{{ roteiro_editor_state_json.bate_volta_diario.volta_saida_hora|default:'' }}"
                 placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
        </div>
        <div class="field cv-field field-size-1">
          <label class="cv-field__label" for="id_bate_volta_volta_tempo_hhmm">Tempo da volta</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_volta_tempo_hhmm" data-mask="time"
                 value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
          <input type="hidden" id="id_bate_volta_volta_tempo_min" name="bate_volta_volta_tempo_min"
                 value="{{ roteiro_editor_state_json.bate_volta_diario.volta_tempo_min|default:'' }}">
        </div>
    </div>

  </div>
  {% endif %}
</div>
