<section class="cv-form-subsection oficio-roteiro-destinos"
         aria-labelledby="sec-destinos-title"
         id="sec-destinos"
         data-destinos-section>
  <header class="cv-form-subsection__header oficio-roteiro-destinos__header">
    <div class="cv-form-subsection__copy">
      <h4 class="cv-form-subsection__title" id="sec-destinos-title">Destinos</h4>
      <p class="cv-form-subsection__description">Adicione os locais na ordem em que serão visitados.</p>
    </div>
    <div class="oficio-roteiro-destinos__actions">
      <button type="button"
              class="cv-btn cv-btn--secondary cv-btn--sm"
              id="btn-adicionar-destino">
        <span>Adicionar destino</span>
      </button>
    </div>
  </header>

  <div class="oficio-roteiro-destinos__list roteiro-destinos-list"
       aria-label="Destinos adicionados"
       id="destinos-container"></div>
</section>
