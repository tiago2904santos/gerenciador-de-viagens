<select name="destino_estado___index__"
        id="destino_estado___index__"
        class="destino-estado cv-search-picker__native"
        data-location-state
        data-entity-picker="true"
        data-entity-picker-mode="single"
        data-picker-variant="compact"
        data-placeholder="Buscar estado..."
        data-empty-message="Nenhum estado encontrado."
        aria-label="UF">
  <option value="">---------</option>
  {% for estado in estados %}
    <option value="{{ estado.pk }}">{{ estado.nome }} ({{ estado.sigla }})</option>
  {% endfor %}
</select>
