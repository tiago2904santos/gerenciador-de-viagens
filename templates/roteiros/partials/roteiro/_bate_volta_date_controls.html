{# Controles visíveis do range bate-volta (ofício). panel_id vem do date_picker. #}
<div class="oficio-roteiro-bate-volta__rows" role="group" aria-label="Datas e horários do bate-volta diário">

  <section class="oficio-roteiro-bate-volta__leg form-block form-block--split route-bate-volta-leg" aria-labelledby="bate-volta-ida-title">
    <header class="form-block__header">
      <div class="form-block__copy">
        <h4 class="form-block__title" id="bate-volta-ida-title">Informações de ida</h4>
        <p class="form-block__description">Data e horário de partida.</p>
      </div>
    </header>
    <div class="form-block__body">
      <div class="field-grid oficio-roteiro-bate-volta__fields">
        <div class="field cv-field">
          <label class="cv-field__label" for="id_bate_volta_data_inicio_display">Data de ida</label>
          <div class="date-picker__control">
            <input type="text" class="cv-field__control" id="id_bate_volta_data_inicio_display" placeholder="dd/mm/aaaa" autocomplete="off" inputmode="numeric" maxlength="10" data-cv-date-picker-start-display readonly>
            <button type="button" class="date-picker__trigger date-picker__trigger--icon" data-cv-date-picker-trigger aria-expanded="false" aria-controls="{{ panel_id }}" aria-label="Abrir calendário da data de ida">
              <c-ui.forms._date_picker_icon />
            </button>
          </div>
        </div>
        <div class="field cv-field">
          <label class="cv-field__label" for="id_bate_volta_ida_saida_hora">Horário de ida</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_ida_saida_hora" name="bate_volta_ida_saida_hora" data-mask="time" value="{{ roteiro_editor_state_json.bate_volta_diario.ida_saida_hora|default:'' }}" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
        </div>
        <div class="field cv-field">
          <label class="cv-field__label" for="id_bate_volta_ida_tempo_hhmm">Tempo de ida</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_ida_tempo_hhmm" data-mask="time" value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
          <input type="hidden" id="id_bate_volta_ida_tempo_min" name="bate_volta_ida_tempo_min" value="{{ roteiro_editor_state_json.bate_volta_diario.ida_tempo_min|default:'' }}">
        </div>
      </div>
    </div>
  </section>

  <section class="oficio-roteiro-bate-volta__leg form-block form-block--split route-bate-volta-leg" aria-labelledby="bate-volta-volta-title">
    <header class="form-block__header">
      <div class="form-block__copy">
        <h4 class="form-block__title" id="bate-volta-volta-title">Informações de volta</h4>
        <p class="form-block__description">Data e horário de retorno.</p>
      </div>
    </header>
    <div class="form-block__body">
      <div class="field-grid oficio-roteiro-bate-volta__fields">
        <div class="field cv-field">
          <label class="cv-field__label" for="id_bate_volta_data_fim_display">Data de volta</label>
          <div class="date-picker__control">
            <input type="text" class="cv-field__control" id="id_bate_volta_data_fim_display" placeholder="dd/mm/aaaa" autocomplete="off" inputmode="numeric" maxlength="10" data-cv-date-picker-end-display readonly>
            <button type="button" class="date-picker__trigger date-picker__trigger--icon" data-cv-date-picker-trigger aria-expanded="false" aria-controls="{{ panel_id }}" aria-label="Abrir calendário da data de volta">
              <c-ui.forms._date_picker_icon />
            </button>
          </div>
        </div>
        <div class="field cv-field">
          <label class="cv-field__label" for="id_bate_volta_volta_saida_hora">Horário de volta</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_volta_saida_hora" name="bate_volta_volta_saida_hora" data-mask="time" value="{{ roteiro_editor_state_json.bate_volta_diario.volta_saida_hora|default:'' }}" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
        </div>
        <div class="field cv-field">
          <label class="cv-field__label" for="id_bate_volta_volta_tempo_hhmm">Tempo de retorno</label>
          <input type="text" class="cv-field__control" id="id_bate_volta_volta_tempo_hhmm" data-mask="time" value="" placeholder="00:00" inputmode="numeric" maxlength="5" autocomplete="off">
          <input type="hidden" id="id_bate_volta_volta_tempo_min" name="bate_volta_volta_tempo_min" value="{{ roteiro_editor_state_json.bate_volta_diario.volta_tempo_min|default:'' }}">
        </div>
      </div>
    </div>
  </section>

</div>
