{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="page-shell page-shell--list">
    <c-ui.headers.filter_page_header eyebrow="PRESTAÇÕES" :title="page_title" icon_label="PC" :form_action="request.path" search_name="q" :search_value="q" search_placeholder="Buscar modelos de texto" :search_clear_url="request.path" />

    <div class="list-panel">
    <div class="form-section-stack form-section-stack--comfortable">
      {% for grupo in grupos %}
        {% with cotton_attr_element_id="grupo-"|add:grupo.campo %}<c-ui.forms.form_block shell="card" :element_id="cotton_attr_element_id" extra_class="modelos-grupo" :title="grupo.label" actions_template="prestacoes_contas/partials/_modelos_grupo_actions.html" body_template="prestacoes_contas/partials/_modelos_grupo_body.html" />{% endwith %}
      {% endfor %}
    </div>
    </div>
  </div>
{% endblock %}
