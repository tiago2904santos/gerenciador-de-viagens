{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="page-shell page-shell--standard-simple">
    <c-ui.headers.page_header eyebrow="PRESTAÇÕES" :title="page_title" :description="page_description" icon_label="PC" module_label="Modelos de Texto" only />

    <form class="main-form-panel form-card" method="post" novalidate>
      {% csrf_token %}
      <c-ui.forms.form_block title="Dados do modelo" description="Escolha o campo, o nome e o texto do modelo." section_id="modelos-texto-form-section" body_template="prestacoes_contas/modelos_texto/_form_body.html" />
      {% with cotton_attr_primary_label=submit_label|default:"Salvar" %}<c-ui.layouts.card_footer_actions secondary_label="Voltar" :secondary_url="back_url" :primary_label="cotton_attr_primary_label" only />{% endwith %}
    </form>
  </div>
{% endblock %}
