{% extends "prestacoes_contas/assinatura/base_publico.html" %}

{% block title %}Assinatura concluída{% endblock %}

{% block content %}
  <c-v2.panel title="Tudo certo!" description="Sua assinatura foi registrada e o documento já está no sistema. Você pode fechar esta página.">
    <c-slot name="body">
      <c-v2.alert tone="success" message="Assinatura registrada." />

      {% if docs %}
        <ul class="person-list">
          {% for d in docs %}
            <c-v2.person_row
              initials="{% if d.assinada %}OK{% else %}··{% endif %}"
              :name="d.label"
              :meta="d.signatario"
              badge="{% if d.assinada %}Assinado{% else %}Pendente{% endif %}"
            />
          {% endfor %}
        </ul>
      {% endif %}
    </c-slot>
  </c-v2.panel>
{% endblock %}
