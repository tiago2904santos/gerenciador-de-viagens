{% firstof doc.nome_original empty_label "Nenhum arquivo anexado" as mensagem_vazia %}
{% with prefixo_acao=doc.assinado|yesno:"Gerenciar,Anexar" %}
{% with rotulo_acao=prefixo_acao|add:" "|add:title %}
<c-v2.document_inline
  :title="title"
  :src="doc.view_url"
  :frame_title="title"
  :empty_message="mensagem_vazia"
  actions_label="Ações do documento"
>
  <c-slot name="actions">
    <c-v2.attach_signed_button
      :url="doc.anexar_url"
      :doc_label="title"
      :signed="doc.assinado"
      :current_name="doc.nome_original"
      :current_view_url="doc.view_url"
      :current_remove_url="doc.remover_url"
      :aria_label="rotulo_acao"
    />
  </c-slot>
</c-v2.document_inline>
{% endwith %}
{% endwith %}
