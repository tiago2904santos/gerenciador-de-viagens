{% if motorista_resumo.cpf %}
  {% with cpf_motorista="CPF "|add:motorista_resumo.cpf %}
    <div class="fact-list" aria-label="Motorista do diário">
      <c-v2.fact label="Motorista" :value="motorista_resumo.nome" :note="cpf_motorista" />
      <c-v2.fact label="Origem do motorista" :value="motorista_resumo.origem" />
    </div>
  {% endwith %}
{% else %}
  <div class="fact-list" aria-label="Motorista do diário">
    <c-v2.fact label="Motorista" :value="motorista_resumo.nome" />
    <c-v2.fact label="Origem do motorista" :value="motorista_resumo.origem" />
  </div>
{% endif %}
{% if motorista_resumo.alterado %}
  <div class="fact-chips">
    <c-v2.chip label="Alterado" tone="warning" size="compact" only />
  </div>
{% endif %}
