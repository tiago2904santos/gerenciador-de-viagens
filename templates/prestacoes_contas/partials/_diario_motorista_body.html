{% comment %}
  Motorista do diário — quem dirigiu, e de onde veio essa informação.

  "Origem" ganha a linha de apoio quando houve troca: o selo de alterado é a
  primeira coisa que quem confere procura, e como fato ele fica ao lado do valor
  que mudou em vez de flutuar no cabeçalho.
{% endcomment %}
<div class="fact-list">
  <c-v2.fact label="Motorista" :value="motorista_resumo.nome" note="{% if motorista_resumo.cpf %}CPF {{ motorista_resumo.cpf }}{% endif %}" />
  <c-v2.fact label="Origem do motorista" :value="motorista_resumo.origem" note="{% if motorista_resumo.alterado %}Alterado nesta prestação{% endif %}" />
</div>
