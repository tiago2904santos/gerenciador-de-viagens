<c-v2.document_inline
  title="Diário de Bordo"
  :src="preview_inline_url"
  frame_title="Diário de Bordo"
  empty_message="O diário ainda não foi gerado."
  actions_label="Ações do documento"
>
  <c-slot name="actions">
    <c-v2.icon_button icon="eye" :href="preview_inline_url" target="_blank" aria_label="Abrir em nova aba" tooltip="Abrir em nova aba" />
    {% if preview_pdf_url %}
      <c-v2.icon_button icon="pdf" :href="preview_pdf_url" aria_label="Baixar PDF" tooltip="Baixar PDF" />
    {% endif %}
    {% if preview_xlsx_url %}
      <c-v2.icon_button icon="download" :href="preview_xlsx_url" aria_label="Baixar XLSX" tooltip="Baixar XLSX" />
    {% endif %}
  </c-slot>
</c-v2.document_inline>
