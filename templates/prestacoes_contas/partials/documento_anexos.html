{% if anexos %}
  <ul class="prestacao-file-list" data-file-list>
    {% for anexo in anexos %}
      <li class="prestacao-file-list__item" data-documento-anexo-id="{{ anexo.id }}">
        <div class="prestacao-file-widget__meta">
          <strong class="prestacao-file-widget__name" title="{{ anexo.nome }}">{{ anexo.nome }}</strong>
          <span class="prestacao-file-widget__subtitle">Arquivo anexado</span>
        </div>
        <div class="prestacao-file-widget__actions">
          <a class="cv-icon-btn cv-icon-btn--preview prestacao-file-widget__action"
             href="{{ anexo.url }}"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="Visualizar arquivo"
             data-tooltip="Visualizar">
            {% include "components/ui/icons/icon.html" with icon="eye" only %}
          </a>
          <button class="cv-icon-btn cv-icon-btn--delete prestacao-file-widget__action"
                  type="button"
                  aria-label="Excluir arquivo"
                  data-tooltip="Excluir"
                  data-file-delete-url="{{ anexo.delete_url }}">
            {% include "components/ui/icons/icon.html" with icon="delete" only %}
          </button>
        </div>
      </li>
    {% endfor %}
  </ul>
{% endif %}
