<div class="form-stack" aria-label="Servidor e número da solicitação">
  {% with s=servidor.identificacao %}
    <ul class="person-list">
      <c-v2.person_row
        :initials="s.iniciais"
        :name="s.nome_servidor"
        :meta="s.meta"
        badge="{% if s.is_motorista %}Motorista{% endif %}"
        extra_class="{% if s.is_motorista %}person-row--driver{% endif %}"
      />
    </ul>
  {% endwith %}

  <c-v2.form_field :field="servidor.form.numero_solicitacao" label="Número da solicitação" :input="True" />
</div>
