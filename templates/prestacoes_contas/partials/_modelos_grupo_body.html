{% if grupo.rows %}
  <div class="record-list" role="list">
    {% for row in grupo.rows %}<c-v2.catalog_row :row="row" :csrf_token="csrf_token" delete_title="Excluir modelo?" />{% endfor %}
  </div>
{% else %}
  <c-v2.panel empty_title="Nenhum modelo cadastrado" empty_message="Nenhum modelo cadastrado para este campo." />
{% endif %}
