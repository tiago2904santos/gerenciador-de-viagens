<div class="field-grid field-grid--cols-4 rt-custeios-grid">
  {% for item in campos_custeio %}
    <div class="rt-cost-field-group{% if item.uses_other %} rt-cost-field-group--select{% endif %}">
      {% include "components/ui/forms/field.html" with field=item.field label=item.label only %}
      {% if item.uses_other %}
        <div class="rt-cost-field__other" data-rt-other-wrapper="{{ item.campo }}" hidden>
          {% include "components/ui/forms/field.html" with field=item.other label="Informe "|add:item.label|lower only %}
        </div>
      {% endif %}
    </div>
  {% endfor %}
</div>
