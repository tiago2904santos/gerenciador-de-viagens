<section class="card-footer-section">
  <div class="card-footer-section__divider" aria-hidden="true"></div>
  <footer class="card-footer">
    <div class="card-footer__secondary">
      {% with cotton_attr_href=back_url|default:"/prestacoes-contas/" %}<c-v2.button :href="cotton_attr_href" label="Voltar à lista" variant="secondary" icon="arrow-left" only />{% endwith %}
    </div>
    <div class="card-footer__primary">
      <c-v2.button label="Salvar texto" variant="secondary" type="submit" name="action" value="save" only />
      <c-v2.button :href="diario_url" label="Ir para Diário de Bordo" variant="primary" icon="arrow-right" :icon_after="True" only />
    </div>
  </footer>
</section>
