{% comment %}Rodapé do Relatório Técnico, segunda etapa: voltar ao diário ou seguir para os documentos.{% endcomment %}
<c-v2.card_footer>
  <c-slot name="secondary">
    <c-v2.button :href="diario_url" label="Voltar ao Diário de Bordo" variant="secondary" icon="arrow-left" only />
  </c-slot>
  <c-slot name="primary">
    <c-v2.button :href="documentos_url" label="Ir para Documentos" variant="primary" icon="arrow-right" :icon_after="True" only />
  </c-slot>
</c-v2.card_footer>
