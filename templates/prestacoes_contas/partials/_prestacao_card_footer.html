{# Rodapé específico da prestação — abrir/assinar despacho + finalizar/arquivar (POST com next=current_url). #}
<div class="entity-card__footer record-card__footer">
  <div class="record-card__footer-actions">
    <div class="record-card__footer-actions-main icon-btn-group">
      <c-ui.buttons.icon_button :href="card.rt_url" action="edit" aria_label="Abrir prestação na etapa 1" tooltip="Abrir prestação" only />
      <c-ui.buttons.button
        type="button"
        class_name="icon-btn icon-btn--sign{% if card.despacho_assinado.assinado %} is-assinado{% endif %}"
        aria_label="{% if card.despacho_assinado.assinado %}Gerenciar despacho assinado{% else %}Anexar despacho assinado{% endif %}"
        data-tooltip="{% if card.despacho_assinado.assinado %}Despacho assinado — gerenciar{% else %}Anexar despacho assinado{% endif %}"
        data-attach-signed-trigger
        data-attach-signed-reopen-key="prestacao-despacho-{{ card.prestacao_pk }}"
        data-attach-signed-accept="application/pdf,image/png,image/jpeg,.pdf,.png,.jpg,.jpeg"
        data-attach-signed-file-description="um arquivo em PDF, PNG ou JPEG"
        data-attach-signed-file-help="Selecione um único arquivo em PDF, PNG, JPG ou JPEG."
        data-attach-signed-choose-label="Escolher arquivo"
        data-attach-signed-upload-label="Anexar arquivo"
        data-attach-signed-url="{{ card.despacho_assinado.anexar_url }}"
        data-attach-signed-doc-label="o despacho do ofício {{ card.numero_display }}"
        data-attach-signed-current-name="{{ card.despacho_assinado.nome_original }}"
        data-attach-signed-current-view-url="{{ card.despacho_assinado.view_url }}"
        data-attach-signed-current-remove-url="{{ card.despacho_assinado.remover_url }}" only><c-ui.icons.icon icon="sign" only /></c-ui.buttons.button>
    </div>

    <div class="record-card__footer-actions--manage icon-btn-group">
      <form method="post" action="{{ card.finalizar_url }}" class="record-card__inline-action">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ current_url }}">
        {% if card.finalizada %}
        <c-ui.buttons.button type="submit" class_name="icon-btn icon-btn--edit" aria_label="Reabrir prestação" data-tooltip="Reabrir prestação" only><c-ui.icons.icon icon="arrow-left" only /></c-ui.buttons.button>
        {% else %}
        <c-ui.buttons.button type="submit" class_name="icon-btn icon-btn--complete" aria_label="Finalizar prestação" data-tooltip="Finalizar prestação" only><c-ui.icons.icon icon="check" only /></c-ui.buttons.button>
        {% endif %}
      </form>

      <form method="post" action="{{ card.arquivar_url }}" class="record-card__inline-action">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ current_url }}">
        {% if card.arquivada %}
        <c-ui.buttons.button type="submit" class_name="icon-btn icon-btn--edit" aria_label="Desarquivar prestação" data-tooltip="Desarquivar prestação" only><c-ui.icons.icon icon="unarchive" only /></c-ui.buttons.button>
        {% else %}
        <c-ui.buttons.button type="submit" class_name="icon-btn icon-btn--archive" aria_label="Arquivar prestação" data-tooltip="Arquivar prestação" only><c-ui.icons.icon icon="archive" only /></c-ui.buttons.button>
        {% endif %}
      </form>
    </div>
  </div>
</div>
