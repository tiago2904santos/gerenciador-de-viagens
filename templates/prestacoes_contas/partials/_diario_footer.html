{% comment %}Rodapé do Diário de Bordo, primeira etapa: sair da prestação ou seguir para o RT.{% endcomment %}
<c-v2.card_footer>
  <c-slot name="secondary">
    {% with cotton_attr_href=back_url|default:"/prestacoes-contas/" %}<c-v2.button :href="cotton_attr_href" label="Voltar à lista" variant="secondary" icon="arrow-left" only />{% endwith %}
  </c-slot>
  <c-slot name="primary">
    <c-v2.button :href="rt_url" label="Ir para Relatório Técnico" variant="primary" icon="arrow-right" :icon_after="True" only />

</c-v2.card_footer>
