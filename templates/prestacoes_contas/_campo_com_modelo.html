{% comment %}
Um campo de texto longo do RT: select de modelos (estilo justificativa do ofício) + textarea.
O gerenciamento integra o `select_with_action` global, sem botão separado no header.
Espera a variável `c` (dict com select, textarea, label e manage_url).
{% endcomment %}
<div class="cv-field--full-width">
  <c-v2.form_field
    :field="c.select"
    label="Modelo"
    :hide_label="True"
    :action_url="c.manage_url"
    action_label="Gerenciar modelos"
    only
  />
</div>
<div class="oficio-justificativa-card__wide-field cv-field--full-width">
  <c-v2.form_field :field="c.textarea" :label="c.label" :input="True" only />
</div>
