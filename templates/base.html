{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{% static 'js/core/theme-shared.js' %}?v=20260513"></script>
  <script src="{% static 'js/core/theme-init.js' %}?v=20260513"></script>
  <title>{% block title %}Central de Viagens 3{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260526-viatura-picker">
  <link rel="stylesheet" href="{% static 'css/utilities.css' %}?v=20260526-viatura-picker">
  <link rel="stylesheet" href="{% static 'css/page-shell.css' %}?v=20260608">
  <link rel="stylesheet" href="{% static 'css/cv-buttons.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app-shell {% block shell_class %}{% endblock %}">
    {% include "components/layout/sidebar.html" %}
    <main class="app-main">
      <section class="content-wrap">
        {% include "components/feedback/alerts.html" %}
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
  <script src="{% static 'js/theme-toggle.js' %}?v=20260513" defer></script>
  <script src="{% static 'js/core/http.js' %}?v=20260520" defer></script>
  <script src="{% static 'js/autosave.js' %}?v=20260527-global" defer></script>
  <script src="{% static 'js/core/app.js' %}?v=20260518" defer></script>
  <script src="{% static 'js/components/sidebar.js' %}" defer></script>
  <script src="{% static 'js/components/masks.js' %}?v=20260520-fase2" defer></script>
  <script src="{% static 'js/components/state-toggle.js' %}?v=20260520-fase2" defer></script>
  <script src="{% static 'js/components/card-toggle.js' %}?v=20260520-fase2" defer></script>
  <script src="{% static 'js/components/realtime-filters.js' %}?v=20260520" defer></script>
  <script src="{% static 'js/components/cv-floating-dropdown.js' %}?v=20260520" defer></script>
  <script src="{% static 'js/components/cv-custom-select.js' %}?v=20260520" defer></script>
  <script src="{% static 'js/components/cv-search-picker.js' %}?v=20260526b" defer></script>
  <script src="{% static 'js/components/cv-date-picker.js' %}?v=20260601e" defer></script>
  <script src="{% static 'js/cv-select.js' %}?v=20260520" defer></script>
  <script src="{% static 'js/components/fields-init.js' %}?v=20260520-fase3" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
