{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{% static 'js/core/theme-shared.js' %}"></script>
  <script src="{% static 'js/core/theme-init.js' %}"></script>
  <title>{% block title %}Central de Viagens 3{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
  <link rel="stylesheet" href="{% static 'css/page-shell.css' %}">
  <link rel="stylesheet" href="{% static 'css/cv-buttons.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app-shell {% block shell_class %}{% endblock %}">
    {% include "components/layout/sidebar.html" %}
    <main class="app-main">
      <section class="content-wrap">
        {% include "components/feedback/alerts.html" %}
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
  <script src="{% static 'js/theme-toggle.js' %}" defer></script>
  <script src="{% static 'js/core/http.js' %}" defer></script>
  <script src="{% static 'js/autosave.js' %}" defer></script>
  <script src="{% static 'js/core/app.js' %}" defer></script>
  <script src="{% static 'js/components/sidebar.js' %}" defer></script>
  <script src="{% static 'js/components/masks.js' %}" defer></script>
  <script src="{% static 'js/components/state-toggle.js' %}" defer></script>
  <script src="{% static 'js/components/card-toggle.js' %}" defer></script>
  <script src="{% static 'js/components/realtime-filters.js' %}" defer></script>
  <script src="{% static 'js/components/cv-floating-dropdown.js' %}" defer></script>
  <script src="{% static 'js/components/cv-custom-select.js' %}" defer></script>
  <script src="{% static 'js/components/cv-search-picker.js' %}" defer></script>
  <script src="{% static 'js/components/cv-date-picker.js' %}" defer></script>
  <script src="{% static 'js/cv-select.js' %}" defer></script>
  <script src="{% static 'js/components/fields-init.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
