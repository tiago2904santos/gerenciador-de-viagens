# Conversão DOCX→PDF rápida: o LibreOffice permanece residente no unoserver.
# A porta 2003 fica somente na rede interna do Compose; nunca deve ser publicada.

services:
  app:
    environment:
      DOCUMENTOS_DEFAULT_PDF_ENGINE: unoserver
      DOCUMENTOS_PDF_AUTO_FALLBACK: "true"
      DOCUMENTOS_ENABLE_LIBREOFFICE: "true"
      DOCUMENTOS_UNOSERVER_URL: http://libreoffice:2003
      DOCUMENTOS_UNOSERVER_TIMEOUT_SECONDS: "5"
    depends_on:
      libreoffice:
        condition: service_healthy

  libreoffice:
    build:
      context: ./unoserver
    expose:
      - "2003"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/unoserver-ready && unoping --host 127.0.0.1 --port 2003 --quiet",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
